<style>
/* Layout: one calm column; lives and score in a slim top bar, one big question card, two big answer buttons */
:root{
  --bg:#F3F1EE; --card:#FFFFFF; --ink:#16181D; --muted:#7A7F88; --line:#E3E0DB; --soft:#EFECE7;
  --red:#D11F35; --good:#23935A; --yolk:#F6C343; --shell:#FBF8F3; --shell-edge:#D9D2C7;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121317; --card:#1C1E24; --ink:#F2F1EE; --muted:#9097A1; --line:#2C2F37; --soft:#24272E;
  --red:#F0384D; --good:#3FC27C; --yolk:#FFCF4D; --shell:#F4F0E8; --shell-edge:#B9B1A4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --card:#1C1E24; --ink:#F2F1EE; --muted:#9097A1; --line:#2C2F37; --soft:#24272E;
  --red:#F0384D; --good:#3FC27C; --yolk:#FFCF4D; --shell:#F4F0E8; --shell-edge:#B9B1A4; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}

.back{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.back svg{width:20px;height:27px}
.back b{font-family:var(--display);font-weight:400;font-size:1.2rem;letter-spacing:.01em}
.lives{display:flex;gap:12px}
.life{width:30px;height:38px;position:relative}
.life svg{width:100%;height:100%;overflow:visible}
.life.cracking svg{animation:wob .45s ease}

.life .half{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.life.broken .l{transform:translate(-2px,2px) rotate(-10deg)}
.life.broken .r{transform:translate(2px,2px) rotate(10deg)}
.life .yolk{opacity:0;transition:opacity .3s .15s}
.life.broken .yolk{opacity:1}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:-4px}
.hud .lives{justify-content:center}
.score{text-align:left;line-height:1}
.score.right{text-align:right}
.timebar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:-6px}
.timebar i{display:block;height:100%;width:100%;background:var(--ink);border-radius:999px;transform-origin:left;transition:background .3s}
.timebar.low i{background:var(--red)}
.score b{font:800 1.6rem var(--mono);font-variant-numeric:tabular-nums}
.score span{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.card{background:var(--card);border-radius:28px;padding:30px 24px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(0,0,0,.25);border:2px solid transparent;transition:border-color .25s}
.card.in{animation:in .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes in{from{transform:translateY(16px) scale(.98);opacity:0}}
.card.right{border-color:var(--good)}
.card.wrong{border-color:var(--red);animation:shake .4s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.kicker{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--red)}
.q{font-size:1.45rem;font-weight:800;line-height:1.25;text-wrap:balance;margin:0;min-height:2.5em;display:flex;align-items:center}
.num{font:800 3.6rem var(--mono);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s}
.num.ok{color:var(--good)}.num.no{color:var(--red)}
.unit{font-size:.95rem;color:var(--muted);font-weight:600;margin-top:-6px;min-height:1.2em}
.was{font:600 .9rem var(--mono);color:var(--muted);min-height:1.2em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns button{border:0;border-radius:22px;height:76px;font:800 1.25rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation;transition:transform .1s}
.btns button:active{transform:scale(.97)}
.btns button svg{width:20px;height:20px}
.btns .up{background:var(--ink);color:var(--bg)}
.btns .down{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btns button:disabled{opacity:.35;cursor:default}
.btns button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.run{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:10px}
.run i{width:10px;height:10px;border-radius:50%;background:var(--good)}
.run i.x{background:var(--red)}
.start,.end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.start h1,.end h1{font-family:var(--display);font-weight:400;font-size:2.6rem;margin:0;line-height:1}
.start p{margin:0;color:var(--muted);font-size:1.02rem;max-width:30ch}
.go{border:0;border-radius:22px;height:64px;width:100%;font:800 1.2rem var(--body);background:var(--red);color:#fff;cursor:pointer}
.ghost{border:0;background:transparent;color:var(--muted);font:700 .95rem var(--body);cursor:pointer;padding:8px}
.end .big{font:800 5rem var(--mono);line-height:1;letter-spacing:-.04em}
.end .sub{color:var(--muted);font-weight:700}
.toast{font-size:.85rem;color:var(--good);min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const $=id=>document.getElementById(id);
/* ---- bank ---- */
const {EV,FA,EL,TH}=OE_DATA;
const D0=new Date(),MON=(()=>{const d=new Date(D0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d})();
const WEEK_NO=Math.round((new Date(MON.getFullYear(),MON.getMonth(),MON.getDate())-new Date(2026,0,5))/604800000);
const THEME=((WEEK_NO%TH.length)+TH.length)%TH.length; // one theme per week; the last one mixes everything
const inTheme=t=>THEME===TH.length-1||t===THEME;
const POOL=(()=>{const P=[];
  EV.forEach(([t,y,f,th])=>{if(inTheme(th))P.push({id:"y:"+t,q:`The year ${t}`,v:y,u:"",yr:1})});
  FA.forEach(([t,v,u,f,th])=>{if(inTheme(th))P.push({id:"f:"+t,q:t,v,u,yr:0})});
  if(inTheme(4))EL.forEach(([n,z,yd,f])=>{if(f===2)P.push({id:"z:"+n,q:`Atomic number of ${n.toLowerCase()}`,v:z,u:"",yr:0})});
  const ev=EV.filter(e=>e[2]<=2&&inTheme(e[3]));
  for(let i=0;i<ev.length;i++)for(let j=i+1;j<ev.length;j++){let [a,b]=[ev[i],ev[j]];const g=Math.abs(a[1]-b[1]);if(g<8||g>300)continue;if(a[1]>b[1])[a,b]=[b,a];
    P.push({id:"g:"+a[0]+"|"+b[0],q:`Years between when ${a[0]} and when ${b[0]}`,v:g,u:"years",yr:0,gap:1})}
  return P})();
function rngOf(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hstr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function ordered(list,salt){const r=rngOf(hstr(salt)),a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const D=D0,TODAY=`${D.getFullYear()}-${D.getMonth()+1}-${D.getDate()}`;
const store={get(k,d){try{const v=localStorage.getItem("redegg2:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("redegg2:"+k,JSON.stringify(v))}catch(e){}}};
const SEEN=new Set(store.get("oeSeen",[]));
// keep the "years between" questions to about one in four
const ORDER=(()=>{const a=ordered(POOL.filter(q=>!q.gap),"oe|"+TODAY),g=ordered(POOL.filter(q=>q.gap),"oeg|"+TODAY),out=[];
  while(a.length||g.length){for(let k=0;k<3&&a.length;k++)out.push(a.shift());if(g.length)out.push(g.shift())}return out})();
let R=rngOf(hstr("oe-lines|"+TODAY));
/* every question is the same difficulty: the line sits a fair distance from the truth */
function lineFor(q){
  const up=R()<.5;
  if(q.yr){const off=4+Math.floor(R()*9);return q.v+(up?off:-off)}
  if(q.v<12){const off=1+Math.floor(R()*Math.max(1,Math.round(q.v*.3)));let L=q.v+(up?off:-off);return Math.max(0,L===q.v?L+1:L)}
  const d=.14+R()*.14,x=q.v*(up?1+d:1-d),mag=Math.pow(10,Math.floor(Math.log10(x))-1);
  let L=Math.round(x/mag)*mag;if(L===q.v)L+=up?mag:-mag;return +L.toPrecision(6);
}
function nextQ(){return ORDER.find(q=>!G.used.has(q.id)&&!SEEN.has(q.id))||ORDER.find(q=>!G.used.has(q.id))||ORDER[0]}
const fmt=n=>Number.isInteger(n)?n.toLocaleString("en-US"):n.toLocaleString("en-US",{maximumFractionDigits:2});
const RUN_SECS=60,PER=5,EGG_BONUS=10;
const scoreFor=(c,eggs)=>Math.min(100,c*PER+eggs*EGG_BONUS);
const ARROW=up=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${up?"M12 3 L21 14 H15 V21 H9 V14 H3 Z":"M12 21 L21 10 H15 V3 H9 V10 H3 Z"}" fill="currentColor"/></svg>`;
const SHELLP="M15 2C23 2 28 15 28 24C28 33 22 38 15 38C8 38 2 33 2 24C2 15 7 2 15 2Z";
function lifeSVG(){return `<svg viewBox="0 0 30 40" aria-hidden="true">
  <ellipse class="yolk" cx="15" cy="34" rx="10" ry="4" fill="var(--yolk)"/>
  <clipPath id="cl"><path d="M0 0 H15 L12 10 L17 17 L13 24 L16 40 H0 Z"/></clipPath><clipPath id="cr"><path d="M30 0 H15 L12 10 L17 17 L13 24 L16 40 H30 Z"/></clipPath>
  <g class="half l" style="transform-origin:15px 38px"><path d="${SHELLP}" fill="var(--shell)" stroke="var(--shell-edge)" stroke-width="1.5" clip-path="url(#cl)"/></g>
  <g class="half r" style="transform-origin:15px 38px"><path d="${SHELLP}" fill="var(--shell)" stroke="var(--shell-edge)" stroke-width="1.5" clip-path="url(#cr)"/></g>
  <ellipse cx="10" cy="13" rx="3" ry="5" fill="#fff" opacity=".8" transform="rotate(20 10 13)"/>
</svg>`}
let G=null;
function drawLives(){$("lives").innerHTML=[0,1,2].map(i=>`<div class="life${i<G.lost?" broken":""}" id="life${i}">${lifeSVG()}</div>`).join("")}
function startScreen(){
  if(G)clearInterval(G.tick);G={n:0,right:0,lost:0,used:new Set(),run:[],busy:false,left:RUN_SECS,last:0,tick:null,over:false};drawLives();$("score").textContent="0";drawTime();
  const best=store.get("oeBest",0);
  $("stage").innerHTML=`<div class="start"><span class="kicker">This week</span><h1>${TH[THEME]}</h1>${best?`<p>Best: <b>${best}</b></p>`:""}<button class="go" id="goBtn">Start</button></div>`;
  $("goBtn").onclick=()=>{layout();ask();G.last=performance.now();G.tick=setInterval(tick,50)};
}
// the clock only runs while a question is on screen
function tick(){const now=performance.now();if(!G.busy){G.left=Math.max(0,G.left-(now-G.last)/1000)}G.last=now;drawTime();if(G.left<=0&&!G.over)end()}
function drawTime(){$("secs").textContent=Math.ceil(G.left);$("tfill").style.transform=`scaleX(${G.left/RUN_SECS})`;document.querySelector(".timebar").classList.toggle("low",G.left<10)}
function layout(){
  $("stage").innerHTML=`<div class="card" id="card"><span class="kicker" id="kick"></span><p class="q" id="q"></p><div class="num" id="num"></div><div class="unit" id="unit"></div><div class="was" id="was"></div></div>
    <div class="btns"><button class="up" id="up"></button><button class="down" id="down"></button></div>
    <div class="run" id="run"></div>`;
  $("up").onclick=()=>answer(true);$("down").onclick=()=>answer(false);
}
function ask(){
  const q=nextQ();G.used.add(q.id);G.q=q;G.L=lineFor(q);
  const c=$("card");c.className="card";void c.offsetWidth;c.classList.add("in");
  $("kick").textContent=TH[THEME];$("q").textContent=q.q;
  const n=$("num");n.className="num";n.textContent=q.yr?G.L:fmt(G.L);
  $("unit").textContent=q.yr?"":q.u;$("was").textContent="";
  $("up").innerHTML=ARROW(true)+(q.yr?"Later":"Over");$("down").innerHTML=ARROW(false)+(q.yr?"Earlier":"Under");
  $("up").disabled=$("down").disabled=false;G.busy=false;
}
function countTo(el,a,b,ms,yr){const t0=performance.now();const dec=!Number.isInteger(b);const step=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3),v=a+(b-a)*e;el.textContent=yr?Math.round(v):dec?fmt(+v.toFixed(2)):fmt(Math.round(v));if(p<1)requestAnimationFrame(step);else el.textContent=yr?b:fmt(b)};requestAnimationFrame(step)}
function answer(over){
  if(G.busy)return;G.busy=true;$("up").disabled=$("down").disabled=true;
  const q=G.q,ok=over?q.v>G.L:q.v<G.L;
  SEEN.add(q.id);store.set("oeSeen",[...SEEN]);
  $("was").textContent=`not ${q.yr?G.L:fmt(G.L)}`;
  const n=$("num");countTo(n,G.L,q.v,650,q.yr);setTimeout(()=>n.classList.add(ok?"ok":"no"),300);
  $("card").classList.add(ok?"right":"wrong");
  G.run.push(ok);$("run").innerHTML=G.run.map(r=>`<i class="${r?"":"x"}"></i>`).join("");
  if(ok){G.right++;$("score").textContent=Math.min(100,G.right*PER)}
  else{const lf=$("life"+G.lost);G.lost++;lf.classList.add("cracking");setTimeout(()=>lf.classList.add("broken"),250)}
  G.n++;
  setTimeout(()=>{if(G.over)return;if(G.lost>=3)end();else ask()},950);
}
function end(){
  if(G.over)return;G.over=true;clearInterval(G.tick);
  const eggs=3-G.lost,pts=scoreFor(G.right,eggs),best=Math.max(store.get("oeBest",0),pts);store.set("oeBest",best);
  const share=`The Red Egg · Egg Flip\n${G.run.map(r=>r?"🟩":"🟥").join("")}\n${TH[THEME]} · ${pts}/100`;
  $("stage").innerHTML=`<div class="end"><div class="big">${pts}</div><div class="sub">${G.right} right${eggs?` · ${eggs} egg${eggs>1?"s":""} left +${eggs*EGG_BONUS}`:""}</div><div class="run">${G.run.map(r=>`<i class="${r?"":"x"}"></i>`).join("")}</div>
    <button class="go" id="copy">Copy result</button><div class="toast" id="toast"></div><button class="ghost" id="again">Play again</button></div>`;
  $("copy").onclick=()=>{try{navigator.clipboard.writeText(share).then(()=>$("toast").textContent="Copied",()=>{})}catch(e){}};
  $("again").onclick=startScreen;
}
startScreen();
