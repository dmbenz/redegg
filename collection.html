<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>document.documentElement.setAttribute("data-theme","light")</script><meta name="color-scheme" content="light"><meta name="theme-color" content="#FFC9A0">
<style>html,body,button,a,[role=button]{touch-action:manipulation}.egg,.slot,button{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}</style>
<title>Red Egg Collection</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>

/* Layout: one 560px column per page; brand header, page content as cards, tab bar fixed at the bottom on phones and a pill row under the header on wider screens */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --tray:#DCE1E6; --ink:#1A1D23; --muted:#5E6673;
  --line:#C9D0D8; --red:#D11F35; --red-dark:#8E1222; --crack:#3A0A12; --good:#2E9B57; --btn:#1A1D23; --btn-ink:#FFFFFF;
  --glow:#F6C343; --chick:#F2C230; --hole:#1A0509;
  --t1:#B98500; --t2:#2E9B57; --t3:#2F6FDB; --t4:#7A6F62; --t5:#8A5A3C;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171C; --surface:#1E232A; --tray:#262C34; --ink:#EEF1F5; --muted:#9AA3B0;
  --line:#353D47; --red:#F0384D; --red-dark:#A01A2D; --crack:#2A060C; --good:#47C474; --btn:#EEF1F5; --btn-ink:#14171C;
  --glow:#FFCF4D; --chick:#FFD34D; --hole:#120306; --t1:#FFC93C; --t2:#47C474; --t3:#6EA0FF; --t4:#B3A898; --t5:#C08A66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171C; --surface:#1E232A; --tray:#262C34; --ink:#EEF1F5; --muted:#9AA3B0;
  --line:#353D47; --red:#F0384D; --red-dark:#A01A2D; --crack:#2A060C; --good:#47C474; --btn:#EEF1F5; --btn-ink:#14171C;
  --glow:#FFCF4D; --chick:#FFD34D; --hole:#120306; --t1:#FFC93C; --t2:#47C474; --t3:#6EA0FF; --t4:#B3A898; --t5:#C08A66; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.meta{flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--red)}
.meta{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;text-align:right}
.meta b{display:block;color:var(--ink);font-size:.95rem;letter-spacing:.02em;text-transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
h3{margin:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* the egg */
.eggcard{align-items:center;text-align:center}
.egg{width:220px;height:253px;position:relative;margin-top:44px}
.egg svg{width:100%;height:100%;overflow:visible}
.egg .body{transform-origin:50% 95%}
.egg.wob1 .body{animation:wob1 .45s ease-in-out 2}
.egg.wob2 .body{animation:wob2 .22s ease-in-out 4}
@keyframes wob1{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes wob2{25%{transform:rotate(-9deg) translateY(-3px)}75%{transform:rotate(9deg) translateY(-3px)}}
.egg .ring{stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset .55s ease-in}
.egg.cracked .ring{stroke-dashoffset:0}
.egg.cracked.partial .ring{stroke-dashoffset:150}
.egg .top{transform-box:view-box;transform-origin:30% 50%;transition:transform 1.1s cubic-bezier(.15,.8,.3,1),opacity .5s ease .6s}
.egg.open .top{transform:translate(-70px,-150px) rotate(-70deg);opacity:0}
.egg .shard{opacity:0;transform-box:fill-box;transform-origin:center}
.egg.open .shard{animation:shard .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes shard{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.egg .chick{opacity:0;transform-box:view-box;transform-origin:50% 75%;transform:translateY(60px) scale(.5)}
.egg.open .chick{animation:pop .8s cubic-bezier(.3,1.7,.5,1) .25s forwards}
@keyframes pop{0%{opacity:1;transform:translateY(60px) scale(.5)}70%{opacity:1;transform:translateY(-44px) scale(1.04)}100%{opacity:1;transform:translateY(-36px)}}
.egg .spark{opacity:0;transform-box:fill-box;transform-origin:center}
.egg.open .spark{animation:twinkle 1.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.egg .peek{opacity:0;transition:opacity .4s ease .2s}
.egg.peeking .peek{opacity:1}
.egg .peek .eyes{animation:blink 3.2s infinite 1s;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.egg .seg{transition:stroke-dashoffset .3s ease-out}
.egg.static *{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
.egg.static.open .spark{animation:twinkle 1.6s ease-in-out infinite!important;animation-delay:var(--d)!important}
.tiername{font-family:var(--display);font-size:1.8rem;line-height:1.1;min-height:1.1em}
.points{font:700 1rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.points b{color:var(--ink);font-size:1.4rem}
.status{color:var(--muted);max-width:40ch;margin:0}
.big{width:100%;border:0;border-radius:14px;padding:16px;font:700 1.05rem var(--body);cursor:pointer;background:var(--btn);color:var(--btn-ink)}

/* days */
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dn{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day .gn{font-weight:700;min-width:0}
.day .gn small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.day .today{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--surface);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.day.sun .gn{color:var(--red)}
.sc{font:700 1rem var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.play{font:700 .9rem var(--body);border:0;border-radius:10px;padding:9px 14px;background:var(--btn);color:var(--btn-ink);cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block}
.play.red{background:var(--red);color:#fff}
.play.re{background:transparent;color:var(--muted);border:1.5px solid var(--line);padding:4px 9px;font-size:.75rem;margin-left:8px}
.soon{font-size:.8rem;color:var(--muted);font-weight:600}

/* collection */
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{font:inherit;color:inherit;border:2px solid transparent;cursor:pointer;background:var(--tray);border-radius:14px;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.slot svg{width:70px;height:70px}
.slot.sel{border-color:var(--ink)}
.slot.locked{cursor:default}
.detail{background:var(--tray);border-radius:14px;padding:14px 16px}
.detail h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:1.2rem}
.detail ul{list-style:none;margin:0;padding:0}
.detail li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.detail li:last-child{border-bottom:0}
.detail li b{font-family:var(--mono)}
.slot .nm{font-size:.74rem;font-weight:700;line-height:1.2}
.slot.locked .nm{color:var(--muted)}
.slot .ct{position:absolute;top:6px;right:8px;font:700 .72rem var(--mono);color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hist li:last-child{border-bottom:0}
.hist b{font-family:var(--mono)}
.hist span:first-child{color:var(--muted)}
.empty{color:var(--muted);margin:0;font-size:.92rem}
details{font-size:.9rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pickwrap{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:.85rem}
.pickwrap select{font:600 .85rem var(--body);padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.tools button{font:600 .85rem var(--body);border-radius:10px;padding:9px 12px;background:transparent;color:var(--ink);border:1.5px solid var(--line);cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (max-width:400px){.coll{grid-template-columns:repeat(3,1fr);gap:7px}.slot svg{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.egg.open .chick{opacity:1;transform:translateY(-36px)}.egg.open .spark{opacity:1;transform:none}}

/* ---------- site chrome ---------- */
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.brand{text-decoration:none;color:inherit}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs a{white-space:nowrap;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.02em}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg .fillme{fill:var(--red)}
@media (min-width:720px){
  body{padding-bottom:40px}
  .tabs{position:static;background:transparent;border:0;padding:0;margin:-6px auto 0;max-width:560px}
  .tabs .in{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
  .tabs a{flex-direction:row;justify-content:center;gap:7px;font-size:.88rem;padding:9px 10px;border-radius:999px}
  .tabs a svg{width:19px;height:19px}
  .tabs a[aria-current="page"]{background:var(--tray)}
}
footer.site{text-align:center;color:var(--muted);font-size:.8rem;padding-top:6px}
footer.site b{font-family:var(--display);font-weight:400;color:var(--ink)}
footer.site .beta{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h2{font-size:2rem}
.pagehead p{margin:0;color:var(--muted);max-width:52ch}
.link{color:var(--ink);font-weight:700;text-decoration:none;font-size:.92rem}
.link:hover{text-decoration:underline}

/* home */
a.big{display:block;text-align:center;text-decoration:none}
.big.red{background:var(--red);color:#fff}
.today{width:100%}
.todaynote{margin:0;background:var(--tray);border-radius:12px;padding:12px 14px;color:var(--muted)}
.todaynote b{color:var(--ink);font-family:var(--mono)}
.teaser{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--tray);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);font-size:.74rem;font-weight:700}
.mini svg{width:64px;height:64px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--tray);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile b{font:700 1.7rem var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.tile small{color:var(--muted);font-size:.8rem}
.gtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gtable th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.gtable td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:.92rem}
.gtable th:first-child,.gtable td:first-child{text-align:left;font-family:var(--body);font-weight:700}
.gtable tr:last-child td{border-bottom:0}
.meter{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--tray);vertical-align:middle;margin-left:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:3px}
.chartwrap{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}

/* how to play */
.how h3{font-size:.75rem;margin-top:4px}
.how p{margin:0;max-width:60ch}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:2.8em 1fr;gap:12px;align-items:start}
.steps .dn{font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.92rem}
.steps li.sun b{color:var(--red)}
.ratings{display:flex;flex-wrap:wrap;gap:6px}
.rpill{display:inline-block;font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq details:last-child{border-bottom:0}
.faq summary{font-size:.98rem}
.faq p{margin:.4em 0 0}

/* week rows: today, locked, missed */
.day{padding-left:10px;padding-right:10px;margin:0 -10px;border-radius:12px}
.day.is-today{border:2px solid var(--red);margin:4px -10px}
.day.locked .gn,.day.locked .dn,.day.missed .gn,.day.missed .dn{opacity:.4}
.lockic{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.day.sun.locked .gn{color:var(--ink)}
.egg .crackline{transition:opacity .3s ease}
.egg.open .crackline{opacity:0}
.unlockrow{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);font-size:.85rem}

/* an unbroken shell sits under the two halves so no seam shows until it opens */
.egg.open .whole{opacity:0}

/* the Red Egg row keeps its look even when locked */
.day.sun .gn{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--red);letter-spacing:.01em}
.day.sun .dn{color:var(--red)}
.day.sun.locked .gn,.day.sun.locked .dn{opacity:1;color:var(--red)}
.day.sun:not(.is-today){background:color-mix(in srgb,var(--red) 7%,transparent)}

.demos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo{background:var(--tray);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.demo b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.demo span{color:var(--muted);font-size:.82rem;line-height:1.3}
@media (hover:hover){.demo:hover{outline:2px solid var(--ink)}}

.slot.special:not(.locked){background:linear-gradient(135deg,color-mix(in srgb,var(--glow) 30%,var(--tray)),var(--tray))}
.coll2{grid-template-columns:repeat(3,1fr)}

/* rarity colors */
:root{--r-mythic:#7A4FD1;--r-legendary:#B98500;--r-epic:#8E44C9;--r-rare:#2F6FDB;--r-uncommon:#2E9B57;--r-common:#6B7480;--r-rough:#8A5A3C;--r-secret:#D14F8E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--r-legendary:#FFC93C;--r-epic:#C08BFF;--r-rare:#6EA0FF;--r-uncommon:#47C474;--r-common:#9AA3B0;--r-rough:#C08A66;--r-secret:#FF8FC4;--r-mythic:#B9A2FF}}
:root[data-theme="dark"]{--r-legendary:#FFC93C;--r-epic:#C08BFF;--r-rare:#6EA0FF;--r-uncommon:#47C474;--r-common:#9AA3B0;--r-rough:#C08A66;--r-secret:#FF8FC4;--r-mythic:#B9A2FF}
.rar{display:inline-block;font:700 .62rem var(--body);text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor;vertical-align:middle;white-space:nowrap}
.r-mythic{border-color:transparent;background:linear-gradient(90deg,#8FE3FF,#C9B8FF,#FF9BD2);color:#2A1B4F}
.r-legendary{color:var(--r-legendary)}.r-epic{color:var(--r-epic)}.r-rare{color:var(--r-rare)}.r-uncommon{color:var(--r-uncommon)}
.r-common{color:var(--r-common)}.r-rough{color:var(--r-rough)}.r-cursed{color:#fff;background:#2B2F35;border-color:#2B2F35}.r-secret{color:var(--r-secret)}
.slot{gap:4px}
.slot.b-mythic{border-color:#B9A2FF}.slot.b-legendary{border-color:var(--r-legendary)}.slot.b-epic{border-color:var(--r-epic)}.slot.b-rare{border-color:var(--r-rare)}
.slot.b-uncommon{border-color:var(--r-uncommon)}.slot.b-common{border-color:var(--line)}.slot.b-rough{border-color:transparent}.slot.b-cursed{border-color:#2B2F35}.slot.b-secret{border-color:var(--r-secret)}
.slot.sel{outline:3px solid var(--ink);outline-offset:1px}
.rarline{margin-top:6px;line-height:1}
.rarline .rar{font-size:.72rem;padding:3px 10px}
.detail h4 .rar{margin-left:4px}
.hatchshare{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font:700 .95rem var(--body);cursor:pointer}

.streak{display:block;margin-top:6px;font:700 .9rem var(--body);color:var(--red)}

.play.catch{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.day.missed:has(.catch) .gn,.day.missed:has(.catch) .dn{opacity:1}

/* week rows: every row the same size; today's red border sits on the same box */
.days{gap:6px}
.day,.day.is-today{box-sizing:border-box;min-height:60px;margin:0;padding:8px 12px;border:2px solid transparent;border-radius:12px;background:color-mix(in srgb,var(--tray) 55%,transparent)}
.day:last-child{border-bottom:2px solid transparent}
.day.is-today{border-color:var(--red)}
.day.sun:not(.is-today){background:color-mix(in srgb,var(--red) 8%,transparent)}
.day.sun .gn{font-size:1.05rem}

/* row buttons all the same size */
.day .play{box-sizing:border-box;min-width:100px;height:38px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid transparent;font-size:.9rem;line-height:1}
.day .play.red{border-color:var(--red)}
.day .play.catch{border-color:var(--ink)}
.day .play.re{min-width:0;height:auto;padding:4px 9px}

/* Sunday hub */
.hubcard{align-items:center;text-align:center;gap:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--red) 10%,var(--surface)),var(--surface) 70%)}
.hubcard .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--red)}
.hubcard h2{font-size:2rem;line-height:1.05;text-wrap:balance}
.hubcard h2 span{color:var(--red)}
.egg.rumble .body{animation:rumble 2.2s ease-in-out infinite}
@keyframes rumble{0%,62%,100%{transform:rotate(0)}66%{transform:rotate(calc(var(--amp) * -1))}72%{transform:rotate(var(--amp))}78%{transform:rotate(calc(var(--amp) * -.6))}84%{transform:rotate(calc(var(--amp) * .4))}}
.totals{display:flex;gap:10px;justify-content:center;width:100%}

/* ---- daily rules shared by every page: same puzzle for everyone, one play per day, streaks ---- */
const DAY_KEYS=["egg-sort","blind-stop","flash","trivia","bridge","pecking-order","sunday"];
const DAY_NAMES=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
/* testing only: "Pretend it's Sunday" moves today to this week's Sunday */
const FAKE_SUNDAY=(()=>{try{return false}catch(e){return false}})();
const NOW=(()=>{const d=new Date();if(FAKE_SUNDAY)d.setDate(d.getDate()+(6-(d.getDay()+6)%7));return d})(),LOCALDAY=ymd(NOW),TODAY_IDX=(NOW.getDay()+6)%7;
const CUR_MONDAY=(()=>{const d=new Date(NOW);d.setDate(d.getDate()-TODAY_IDX);return ymd(d)})();
const WEEK_NO=Math.round((new Date(CUR_MONDAY+"T12:00:00")-new Date("2026-01-05T12:00:00"))/604800000);
/* the date a day's game belongs to this week, so a catch-up gets the same puzzle everyone played that day */
function gameDate(key){const i=DAY_KEYS.indexOf(key);const d=new Date(CUR_MONDAY+"T12:00:00");d.setDate(d.getDate()+Math.max(0,i));return ymd(d)}
const SUN_KEYS=["egg-sort","blind-stop","flash","trivia","bridge","pecking-order"];

const RS={get(k,d){try{const v=localStorage.getItem("redegg2:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("redegg2:"+k,JSON.stringify(v))}catch(e){}}};

function currentWeek(){let w=RS.get("week",null);if(!w||!w.id||w.id!==CUR_MONDAY){w={id:CUR_MONDAY,days:{},sunday:{}};RS.set("week",w)}w.days=w.days||{};w.sunday=w.sunday||{};return w}
function markPlayed(){const s=RS.get("playDays",[]);if(!s.includes(LOCALDAY)){s.push(LOCALDAY);RS.set("playDays",s)}}
function dayStreak(){const s=new Set(RS.get("playDays",[]));const d=new Date(NOW);if(!s.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(s.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function bestDayStreak(){const s=[...new Set(RS.get("playDays",[]))].sort();let best=0,run=0,prev=null;for(const k of s){const d=new Date(k+"T12:00:00");run=prev&&Math.round((d-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=d}return best}
function weekStreak(){const ids=new Set(RS.get("pen",[]).map(p=>p.id));const d=new Date(CUR_MONDAY+"T12:00:00");if(!ids.has(ymd(d)))d.setDate(d.getDate()-7);let n=0;while(ids.has(ymd(d))){n++;d.setDate(d.getDate()-7)}return n}
/* the week is ready for Sunday once Mon–Sat are all played (catch-ups count) */
function weekReady(w){return Object.keys(w.sunday||{}).length>0||SUN_KEYS.every(k=>k in w.days)}
/* stop replays and off-day plays (testing can unlock every day) */
function dailyGate(mode,key,name){
  if(mode==="practice"||false)return false;
  const w=currentWeek();let msg=null;
  if(mode==="day"){
    if(key in w.days)msg=`You already played today's ${name}. You scored <b>${Math.round(w.days[key])}</b>. A new puzzle is waiting tomorrow.`;
    else if(DAY_KEYS.indexOf(key)>TODAY_IDX)msg=`${name} is ${DAY_NAMES[DAY_KEYS.indexOf(key)]}'s game. It unlocks on ${DAY_NAMES[DAY_KEYS.indexOf(key)]}.`;
    else if(SUN_KEYS.every(k=>k in w.sunday))msg=`This week's egg has already hatched, so ${name} can't be caught up. A new egg starts Monday.`;
  }else if(mode==="sunday"){
    if(TODAY_IDX!==6)msg=`The Red Egg is played on Sunday.`;
    else if(!weekReady(w))msg=`Finish the week first. Play your missed days, then come back for the Red Egg.`;
    else if(key in w.sunday)msg=`You already played this round of the Red Egg.`;
    else{const nx=SUN_KEYS.find(k=>!(k in w.sunday));if(nx&&nx!==key){location.replace(nx+".html#sunday");return true}}
  }
  if(!msg)return false;
  const wrap=document.querySelector(".wrap");
  [...wrap.children].forEach(el=>{if(el.tagName!=="HEADER")el.hidden=true});
  wrap.insertAdjacentHTML("beforeend",`<section class="card" style="align-items:center;text-align:center;gap:16px"><p style="margin:0;font-size:1.05rem;max-width:36ch">${msg}</p><a href="index.html" style="display:block;width:100%;text-align:center;text-decoration:none;border-radius:16px;padding:16px;font:700 1.05rem var(--body);background:var(--btn);color:var(--btn-ink)">Back to the egg</a></section>`);
  return true;
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
/* This week's crack network: a jagged fracture around the egg (where it will break), branches off it,
   and separate impact points all over the shell. Segments are ordered the way they appear. */
function buildNet(seed){
  // one jagged crack running left to right across the middle of the egg
  const r=mulberry(hash("crack3-"+seed));
  const RN=31,nodes=[];
  for(let i=0;i<RN;i++){const x=10+i*(180/(RN-1));nodes.push([x,118+(i%2?-1:1)*(2.5+r()*5.5)+(r()-.5)*4])}
  return {nodes};
}
function clipPaths(net){
  const pts=net.nodes.map(([x,y])=>`L${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  const rev=net.nodes.slice().reverse().map(([x,y])=>`L${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  return `<clipPath id="ct"><path d="M0 0 L200 0 ${rev} Z"/></clipPath>
    <clipPath id="cb"><path d="M0 240 ${pts} L200 240 Z"/></clipPath>
    <clipPath id="cs"><path d="${SHELL}"/></clipPath>`;
}

  function showErr(html){const e=el("nameErr");e.innerHTML=html;e.hidden=false;wireHint(e)}
  async function check(){
    const n=el("nameIn").value.replace(/\s+/g," ").trim(),a=el("nameAvail"),my=++seq;
    if(mode==="link"||!n||(mode==="rename"&&lbKey(n)===lbKey(lbName()))){a.hidden=true;return}
    try{const list=await others();if(my!==seq)return;
      const taken=list.some(p=>p.id!==me&&lbKey(p.name)===lbKey(n));
      a.className="nameavail "+(taken?"no":"ok");a.innerHTML=taken?"Taken · "+linkHint:"✓ Available";a.hidden=false;
      wireHint(a);
    }catch(e){a.hidden=true}
  }
  async function submit(){
    const v=el("nameIn").value.replace(/\s+/g," ").trim();
    if(!v){el("nameIn").focus();return}
    el("nameSave").disabled=true;el("nameErr").hidden=true;
    try{
      if(mode==="link"){await LB.redeemLink(v);location.reload();return}
      const n=v.slice(0,16),old=lbName();RS.set("lbName",n);
      try{await lbSync(true)}catch(e){RS.set("lbName",old);throw e}
      cache=null;el("nameAvail").hidden=true;
      if(o.onDone)o.onDone(mode);
    }catch(e){
      if(e.message==="taken"){el("nameAvail").hidden=true;showErr("That username is taken. "+linkHint)}
      else showErr(e.message==="badcode"?"That code didn't work.":e.message==="account"?"That code is for a different account.":"Couldn't connect. Try again.");
    }finally{el("nameSave").disabled=false}
  }
  el("nameSave").onclick=submit;
  el("nameIn").onkeydown=e=>{if(e.key==="Enter")submit()};
  el("nameIn").oninput=()=>{el("nameErr").hidden=true;clearTimeout(timer);timer=setTimeout(check,350)};
  el("swapMode").onclick=()=>setMode(mode==="link"?"join":"link");
  if(el("cancelName"))el("cancelName").onclick=()=>{el("nameCard").hidden=true;if(o.onCancel)o.onCancel()};
  if(el("laterBtn"))el("laterBtn").onclick=()=>{RS.set("lbLater",LOCALDAY);el("nameCard").hidden=true};
  return {setMode};
}

(function(){
  const pen=STORE.get("pen",[]);
  $("penCount").textContent=`${pen.length} chick${pen.length===1?"":"s"}`;
  renderCollection();wireCollection();
  const keys=new Set(pen.map(p=>penKey(p)));const found=MAIN_CHICKS.filter(t=>keys.has(t.key)).length,sp=SECRET_CHICKS.filter(t=>keys.has(t.key)).length;
  $("collNote").textContent=pen.length?`${found} of ${MAIN_CHICKS.length} chicks discovered.`:"Nothing here yet. Crack your first egg on Sunday and your chick moves in.";
  $("specialNote").textContent=`${sp} of ${SECRET_CHICKS.length} found. Each one hides behind an exact weekly score.`;
})();
