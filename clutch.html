<style>
/* Layout: same play column as every Red Egg game; round header, stage, result, one action button */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --tray:#DCE1E6; --cup:#C6CED7; --ink:#1A1D23; --muted:#5E6673;
  --line:#C9D0D8; --red:#D11F35; --good:#2E9B57; --bad:#8A5A3C; --btn:#1A1D23; --btn-ink:#FFFFFF; --box:#FFFFFF; --shell:#F4F1EC;
  --t1:#B98500; --t2:#2E9B57; --t3:#2F6FDB; --t4:#7A6F62; --t5:#8A5A3C;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171C; --surface:#1E232A; --tray:#262C34; --cup:#333B45; --ink:#EEF1F5; --muted:#9AA3B0;
  --line:#353D47; --red:#F0384D; --good:#47C474; --bad:#C08A66; --btn:#EEF1F5; --btn-ink:#14171C; --box:#1A1E24; --shell:#D9D4CC;
  --t1:#FFC93C; --t2:#47C474; --t3:#6EA0FF; --t4:#B3A898; --t5:#C08A66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171C; --surface:#1E232A; --tray:#262C34; --cup:#333B45; --ink:#EEF1F5; --muted:#9AA3B0;
  --line:#353D47; --red:#F0384D; --good:#47C474; --bad:#C08A66; --btn:#EEF1F5; --btn-ink:#14171C; --box:#1A1E24; --shell:#D9D4CC;
  --t1:#FFC93C; --t2:#47C474; --t3:#6EA0FF; --t4:#B3A898; --t5:#C08A66; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;margin:0}
.brand h1 span{color:var(--red)}
.meta{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;text-align:right;flex-shrink:0}
.meta b{display:block;color:var(--ink);font-size:.95rem;letter-spacing:.02em;text-transform:none}
.meta a{display:block;color:var(--muted);text-decoration:none;font-weight:700;margin-bottom:2px}
.progress{display:flex;gap:6px;justify-content:center}
.progress svg{width:26px;height:36px;transition:transform .2s}
.progress .cur{transform:translateY(-3px) scale(1.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.roundhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.roundhead h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.roundhead .stat{font-size:.85rem;color:var(--muted);font-weight:600}
.big{width:100%;border:0;border-radius:16px;padding:18px;font:700 1.15rem var(--body);cursor:pointer;background:var(--btn);color:var(--btn-ink)}
.big:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.result{min-height:5em;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.result .sub{color:var(--muted);font-size:.92rem;max-width:46ch}
.pts{font-family:var(--mono);font-size:2rem;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.pts small{font-size:.95rem;color:var(--muted);font-weight:500}
.pill{display:inline-block;font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pill.t1{color:var(--t1)}.pill.t2{color:var(--t2)}.pill.t3{color:var(--t3)}.pill.t4{color:var(--t4)}.pill.t5{color:var(--t5)}
.end td .pill{font-size:.64rem;padding:2px 7px}
details{font-size:.92rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
details p{margin:.5em 0 0;max-width:62ch}
.end{align-items:center;text-align:center}
.end .tier{font-family:var(--display);font-size:1.5rem}
.end .score{font-family:var(--display);font-size:4rem;line-height:1}
.end .score small{font-size:1.4rem;color:var(--muted)}
.end .note{margin:0;max-width:42ch;color:var(--muted)}
.end table{border-collapse:collapse;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;width:100%;max-width:420px}
.end td,.end th{padding:5px;border-bottom:1px solid var(--line);text-align:right}
.end th{color:var(--muted);font-weight:500;font-family:var(--body);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.end td:nth-child(-n+2),.end th:nth-child(-n+2){text-align:left}
.share{font-family:var(--mono);white-space:pre;background:var(--tray);border-radius:10px;padding:12px 16px;font-size:.9rem;text-align:left;user-select:all}
.actions{display:flex;gap:10px;width:100%}
.actions button,.actions a{font:700 1rem var(--body);border-radius:12px;padding:14px 18px;cursor:pointer;flex:1;text-align:center;text-decoration:none}
.actions .primary{background:var(--btn);color:var(--btn-ink);border:0}
.actions .ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.toast{font-size:.85rem;color:var(--good);min-height:1.2em}
#stage{display:flex;flex-direction:column;gap:14px}
.cl-top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.cat{background:var(--tray);border-radius:14px;padding:12px 14px;min-height:76px;display:flex;flex-direction:column;justify-content:center}
.cat small{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.cat b{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.1;text-wrap:balance;transition:filter .4s,opacity .4s}
.cat.hidden b{filter:blur(9px);opacity:.6;user-select:none}
.ring{position:relative;width:76px;height:76px}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--tray);stroke-width:7}
.ring .fg{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;transition:stroke .3s}
.ring.low .fg{stroke:var(--bad)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .num b{font:700 1.5rem var(--mono)}
.ring .num span{font-size:.62rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.guess{display:flex;gap:8px}
.guess input{flex:1;min-width:0;font:600 1.15rem var(--body);padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--box);color:var(--ink)}
.guess input:focus{outline:none;border-color:var(--ink)}
.guess input:disabled{opacity:.6}
.guess input.bad{animation:shake .35s;border-color:var(--bad)}
.guess input.dupe{animation:shake .35s;border-color:var(--muted)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.guess button{border:0;border-radius:12px;padding:0 18px;font:700 1rem var(--body);background:var(--btn);color:var(--btn-ink);cursor:pointer}
.guess button:disabled{opacity:.4}
.flash{min-height:1.3em;text-align:center;font-weight:700;font-size:.92rem;color:var(--muted);margin-top:-4px}
.flash.ok{color:var(--good)}
.basket{position:relative;height:200px;margin:0 auto;width:100%;max-width:330px}
.basket .eggs{position:absolute;left:12%;right:12%;bottom:44px;top:0;overflow:visible}
.basket .e{position:absolute;width:30px;height:40px;animation:fall .55s cubic-bezier(.45,0,.6,1.4) both}
.basket .e svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
@keyframes fall{0%{transform:translateY(-200px) rotate(-30deg);opacity:0}15%{opacity:1}100%{transform:translateY(0) rotate(var(--r))}}
.basket .front{position:absolute;left:0;right:0;bottom:0;height:74px;pointer-events:none;z-index:2}
.basket .front svg{width:100%;height:100%}
.basket .count{z-index:3;position:absolute;left:0;right:0;bottom:12px;text-align:center;font:700 1.6rem var(--mono);color:#FFF6E8;text-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:none}
.basket .count small{display:block;font:700 .62rem var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:28px}
.chips span{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tray);animation:chip .3s ease both}
.chips span.miss{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
@keyframes chip{from{transform:scale(.6);opacity:0}}
.plus{position:fixed;pointer-events:none;font:700 1.4rem var(--mono);color:var(--good);animation:rise .8s ease-out forwards;z-index:9}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

html,body{background:var(--bg)}
.farm{position:absolute;left:0;right:0;top:0;height:520px;z-index:0;pointer-events:none;overflow:hidden}
.farm svg{position:absolute;left:50%;top:0;width:max(100%,390px);height:520px;transform:translateX(-50%)}
body>*:not(.farm):not(.htcover){position:relative;z-index:1}
/* tab bar: the dark floating pill */
.tabs{left:12px!important;right:12px!important;bottom:14px!important;background:#3B2A1E!important;border:0!important;border-radius:22px;padding:8px!important}
.tabs .in{gap:4px}
.tabs a{color:#E8C9A0!important;border-radius:16px;padding:8px 2px!important}
.tabs a[aria-current="page"]{background:#5A4130;color:#FFF8EC!important}
.tabs a[aria-current="page"] svg .fillme{fill:#FF6A6F}

/* ---------- Sunrise Farm: shared page pieces ---------- */
html,body{overflow-x:hidden}
/* one header on every page: logo left, page info right, never wrapping under the logo */
header{flex-wrap:nowrap!important}
header .meta{flex-shrink:0;max-width:132px}
header .meta b{white-space:normal}
/* footer and tab bar from the Sunrise design */
footer.site{font-family:"Fredoka",var(--body);font-weight:600;color:#7A4E2A}
footer.site b{font-weight:600}
footer.site .beta{border:1.5px solid #C9A577;color:#7A4E2A;background:transparent;font-family:"Nunito",var(--body);font-weight:800}
.tabs a{font-family:"Nunito",var(--body);font-weight:800}
/* ---------- Home: egg in a nest on the farm, score in a cream panel ---------- */
.eggcard{background:transparent!important;border-color:transparent!important;padding:0!important}
.egg{z-index:0}
.egg>svg:not(.nest){position:relative;z-index:1}
.egg svg>ellipse[fill^="rgba"]{display:none}
.egg .whole circle,.egg .body>g[clip-path] circle,.egg .top circle{display:none}
.egg .nest{position:absolute;left:50%;transform:translateX(-50%);width:380px;height:141px;pointer-events:none;overflow:visible}
.egg .nest.back{bottom:-65px;z-index:0}
.egg .nest.front{bottom:-65px;z-index:2}
.eggpanel{background:var(--surface);border-radius:24px;padding:20px 18px;box-shadow:0 4px 0 #EED3A2;margin-top:58px;box-sizing:border-box;position:relative;z-index:3}
.eggpanel .points{font-family:"Nunito",var(--body);font-weight:800;color:#7A4E2A;font-size:15px}
.eggpanel .points b{font-family:"Fredoka",var(--body);font-weight:700;color:#C8362F;font-size:26px}
.eggpanel .status{font-family:"Nunito",var(--body);color:#7A4E2A;font-size:15px}
.eggpanel .today{width:100%}
.eggpanel .big{background:#E0303F!important;color:#fff!important;border-radius:18px;font-family:"Fredoka",var(--body);font-weight:700;font-size:19px;box-shadow:0 5px 0 #A81E2B}
.eggpanel .todaynote{font-family:"Nunito",var(--body);color:#7A4E2A}
header .brand{flex-shrink:0}
header .meta b{font-size:.82rem}
.eggpanel .tiername:empty{display:none}
/* a bigger weekly total */
.eggpanel .points{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.eggpanel .points b{font-size:52px;line-height:1}
.eggpanel .points .ptsdelta{font-family:"Fredoka",var(--body);font-size:20px;color:#3E8E3A;top:-4px}
.eggpanel .points .streak{margin-top:6px}
/* the share picture sits over everything */
body>.cardcover,body>.confetti,body>.sheetcover{position:fixed!important;inset:0!important;z-index:400!important}
/* very small phones: shrink the logo a little so the page info fits */
@media (max-width:359px){header .brand h1{font-size:1.5rem!important}header .brand svg{width:22px;height:30px}header .brand{gap:6px}header .meta{font-size:.68rem}}

/* computers only: keep the farm at phone size in the middle and let it run out past both edges */
.farm .wide{display:none}
@media (min-width:700px){.farm{height:940px}.farm svg{width:390px;overflow:visible}.farm .wide{display:inline}}
body>.iabbar{position:sticky!important;z-index:280!important}

<script>
/* ---- daily rules shared by every page: same puzzle for everyone, one play per day, streaks ---- */
const DAY_KEYS=["blind-stop","clutch","flash","trivia","bridge","pecking-order","sunday"];
const DAY_NAMES=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
/* testing only: "Pretend it's Sunday" moves today to this week's Sunday */
const FAKE_SUNDAY=(()=>{try{return false}catch(e){return false}})();
/* testing only: "Next week" jumps the calendar ahead a week at a time */
const WEEK_SHIFT=(()=>{try{return Math.max(0,0)}catch(e){return 0}})();
const NOW=(()=>{const d=new Date();d.setDate(d.getDate()+7*WEEK_SHIFT);if(FAKE_SUNDAY)d.setDate(d.getDate()+(6-(d.getDay()+6)%7));return d})(),LOCALDAY=ymd(NOW),TODAY_IDX=(NOW.getDay()+6)%7;
const CUR_MONDAY=(()=>{const d=new Date(NOW);d.setDate(d.getDate()-TODAY_IDX);return ymd(d)})();
const WEEK_NO=Math.round((new Date(CUR_MONDAY+"T12:00:00")-new Date("2026-01-05T12:00:00"))/604800000);
/* the date a day's game belongs to this week, so a catch-up gets the same puzzle everyone played that day */
function gameDate(key){const i=DAY_KEYS.indexOf(key);const d=new Date(CUR_MONDAY+"T12:00:00");d.setDate(d.getDate()+Math.max(0,i));return ymd(d)}
const SUN_KEYS=["blind-stop","clutch","flash","trivia","bridge","pecking-order"];
/* the Claude preview gets its own puzzles so practicing there never spoils the live week (the live build blanks this) */
const SEED_SALT="";
function hashStr(s){s=String(s)+SEED_SALT;let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rngFrom(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seededOrder(list,salt){const r=rngFrom(hashStr(salt)),a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const RS={get(k,d){try{const v=localStorage.getItem("redegg2:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("redegg2:"+k,JSON.stringify(v))}catch(e){}}};
/* a new egg every Monday */
function currentWeek(){let w=RS.get("week",null);if(!w||!w.id||w.id!==CUR_MONDAY){w={id:CUR_MONDAY,days:{},sunday:{}};RS.set("week",w)}w.days=w.days||{};w.sunday=w.sunday||{};return w}
function markPlayed(){const s=RS.get("playDays",[]);if(!s.includes(LOCALDAY)){s.push(LOCALDAY);RS.set("playDays",s)}}
function dayStreak(){const s=new Set(RS.get("playDays",[]));const d=new Date(NOW);if(!s.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(s.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function bestDayStreak(){const s=[...new Set(RS.get("playDays",[]))].sort();let best=0,run=0,prev=null;for(const k of s){const d=new Date(k+"T12:00:00");run=prev&&Math.round((d-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=d}return best}
function weekStreak(){const ids=new Set(RS.get("pen",[]).map(p=>p.id));const d=new Date(CUR_MONDAY+"T12:00:00");if(!ids.has(ymd(d)))d.setDate(d.getDate()-7);let n=0;while(ids.has(ymd(d))){n++;d.setDate(d.getDate()-7)}return n}
/* the week is ready for Sunday once Mon–Sat are all played (catch-ups count) */
function weekReady(w){return Object.keys(w.sunday||{}).length>0||SUN_KEYS.every(k=>k in w.days)}
/* stop replays and off-day plays (testing can unlock every day) */
function dailyGate(mode,key,name){
  if(mode==="practice"||false)return false;
  const w=currentWeek();let msg=null;
  if(mode==="day"){
    if(key in w.days)msg=`You already played today's ${name}. You scored <b>${Math.round(w.days[key])}</b>. A new puzzle is waiting tomorrow.`;
    else if(DAY_KEYS.indexOf(key)>TODAY_IDX)msg=`${name} is ${DAY_NAMES[DAY_KEYS.indexOf(key)]}'s game. It unlocks on ${DAY_NAMES[DAY_KEYS.indexOf(key)]}.`;
    else if(SUN_KEYS.every(k=>k in w.sunday))msg=`This week's egg has already hatched, so ${name} can't be caught up. A new egg starts Monday.`;
  }else if(mode==="sunday"){
    if(TODAY_IDX!==6)msg=`The Red Egg is played on Sunday.`;
    else if(!weekReady(w))msg=`Finish the week first. Play your missed days, then come back for the Red Egg.`;
    else if(key in w.sunday)msg=`You already played this round of the Red Egg.`;
    else{const nx=SUN_KEYS.find(k=>!(k in w.sunday));if(nx&&nx!==key){location.replace(nx+".html#sunday");return true}}
  }
  if(!msg)return false;
  const wrap=document.querySelector(".wrap");
  [...wrap.children].forEach(el=>{if(el.tagName!=="HEADER")el.hidden=true});
  wrap.insertAdjacentHTML("beforeend",`<section class="card" style="align-items:center;text-align:center;gap:16px"><p style="margin:0;font-size:1.05rem;max-width:36ch">${msg}</p><a href="index.html" style="display:block;width:100%;text-align:center;text-decoration:none;border-radius:16px;padding:16px;font:700 1.05rem var(--body);background:var(--btn);color:var(--btn-ink)">Back to the egg</a></section>`);
  return true;
}

/* ---------- pause & resume a daily game ----------
   Leaving mid-game (switching apps, locking the phone, reloading) pauses it. Coming back shows a
   Resume screen with the board hidden; Resume picks up exactly where you were. Each game supplies
   snap() (what to save), restore(d) (rebuild from a save), pause() and resume() (stop/start its clock). */
const PAUSE={key:null,over:false,
  k(){return "resume:"+this.key},
  save(d){if(!this.over)RS.set(this.k(),d)},
  load(){return RS.get(this.k(),null)},
  clear(){try{localStorage.removeItem("redegg2:"+this.k())}catch(e){}},
  done(){this.over=true;if(this.key)this.clear()},
  cover(title,sub,go){
    if(document.getElementById("pauseCover"))return;
    if(!document.getElementById("pauseCss")){const st=document.createElement("style");st.id="pauseCss";st.textContent=
      '#pauseCover{position:fixed;inset:0;z-index:300;background:var(--bg,#14171C);display:flex;align-items:center;justify-content:center;padding:16px}'+
      '#pauseCover .pc{width:100%;max-width:420px;background:var(--surface,#1E232A);color:var(--ink,#EEF1F5);border:1px solid var(--line,#353D47);border-radius:20px;padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}'+
      '#pauseCover small{font:700 .72rem var(--body,system-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--muted,#9AA3B0)}'+
      '#pauseCover h2{margin:0;font:400 1.8rem var(--display,system-ui)}'+
      '#pauseCover p{margin:0;color:var(--muted,#9AA3B0);font-weight:600}'+
      '#pauseCover button{margin-top:10px;width:100%;border:0;border-radius:14px;padding:16px;font:700 1.05rem var(--body,system-ui);background:var(--red,#F0384D);color:#fff;cursor:pointer}';
      document.head.appendChild(st)}
    const d=document.createElement("div");d.id="pauseCover";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
    d.innerHTML='<div class="pc"><small>Paused</small><h2></h2><p></p><button type="button">Resume</button></div>';
    d.querySelector("h2").textContent=title;d.querySelector("p").textContent=sub||"";
    document.body.appendChild(d);
    const b=d.querySelector("button");b.onclick=()=>{d.remove();go()};setTimeout(()=>b.focus(),30);
  }
};
function setupResume(key,mode,h){
  if(mode==="practice")return;
  PAUSE.key=key+":"+mode+":"+(mode==="day"?gameDate(key):LOCALDAY);
  let paused=false;
  const blocked=()=>[...document.querySelectorAll("a")].some(a=>a.textContent.trim()==="Back to the egg"&&!a.closest("#end"));
  const show=()=>{const [t,s]=h.label();PAUSE.cover(t,s,()=>{paused=false;h.resume&&h.resume()})};
  function leave(){
    if(paused||PAUSE.over)return;
    let d=null;try{d=h.snap()}catch(e){}
    if(!d)return;
    PAUSE.save(d);try{h.pause&&h.pause()}catch(e){}
    paused=true;
    show(); // cover the board right away, so the phone's app switcher snapshot shows the pause screen
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")leave();else if(paused&&!PAUSE.over)show()});
  window.addEventListener("pagehide",leave);
  window.addEventListener("blur",()=>{if(document.visibilityState==="hidden"||!document.hasFocus())leave()});
  window.addEventListener("pageshow",e=>{if(e.persisted&&paused&&!PAUSE.over)show()});
  if(blocked()){PAUSE.clear();PAUSE.over=true;return}
  const d=PAUSE.load();
  if(d){try{h.restore(d);paused=true;show()}catch(e){PAUSE.clear()}}
}

const MODE=location.hash==="#sunday"?"sunday":location.hash==="#day"?"day":"practice";
const GAMEKEY="clutch",SUN_POS="2 of 6",SUN_MULT=1;
const ROUNDS=MODE==="sunday"?1:5;
const RND=MODE==="practice"?Math.random:rngFrom(hashStr(GAMEKEY+"|"+MODE+"|"+(MODE==="day"?gameDate(GAMEKEY):LOCALDAY)));
if(MODE==="sunday"){document.querySelectorAll("header a").forEach(x=>{x.style.pointerEvents="none";x.setAttribute("tabindex","-1")});document.getElementById("metaSub").textContent="Sunday · "+SUN_POS;const b=document.getElementById("backlink");b.textContent="Sunday";b.style.color="var(--red)";b.style.pointerEvents="none"}
else if(MODE==="day")document.getElementById("metaSub").textContent="Tuesday";
dailyGate(MODE,GAMEKEY,"Clutch");
const $=id=>document.getElementById(id);
const TIERS=[[19,"Perfect Yolk","t1"],[15,"Sunny Side Up","t2"],[10,"Over Easy","t3"],[5,"Cracked","t4"],[0,"Rotten Egg","t5"]];
const tierOf=p=>TIERS.find(([m])=>p>=m-1e-9);
const pill=p=>{const [,n,c]=tierOf(p);return `<span class="pill ${c}">${n}</span>`};
const EMO=p=>({t1:"🟨",t2:"🟩",t3:"🟦",t4:"⬜",t5:"🟫"})[tierOf(p)[2]];
const EGGP="M30 3C46 3 57 31 57 48C57 66 45 78 30 78C15 78 3 66 3 48C3 31 14 3 30 3Z";
const eggIcon=(c,dim)=>`<svg viewBox="0 0 60 80" aria-hidden="true"><path d="${EGGP}" fill="${c}"/><ellipse cx="20" cy="30" rx="6" ry="11" fill="#fff" opacity="${dim?0:.32}" transform="rotate(20 20 30)"/></svg>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RND()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const G={round:0,results:[]};
function drawProgress(){
  $("progress").innerHTML=Array.from({length:ROUNDS},(_,i)=>{const done=i<G.results.length;
    return `<span class="${i===G.round&&!done?"cur":""}">${eggIcon(done?"var(--ink)":i===G.round?"var(--muted)":"var(--line)",!done&&i!==G.round)}</span>`}).join("");
}
function setResult(h){$("result").innerHTML=h}
function hint(t){setResult(`<span class="sub">${t}</span>`)}
function roundDone(pts,msg,extra){
  G.results.push(Object.assign({pts},extra||{}));
  setResult(`<span class="pts">+${(MODE==="sunday"?pts*SUN_MULT:pts).toFixed(1)} <small>pts</small></span>${pill(pts)}<span class="sub">${msg}</span>`);
  const b=$("nextBtn");b.hidden=false;b.textContent=MODE==="sunday"?"Next: Flash":G.round+1<ROUNDS?"Next round":"See your score";drawProgress();b.focus();
}
$("nextBtn").onclick=()=>{
  if(MODE==="sunday"){PAUSE.done();markPlayed();const w=currentWeek();w.sunday[GAMEKEY]=+(G.results[0].pts*SUN_MULT).toFixed(1);RS.set("week",w);location.href="flash.html#sunday";return}
  $("nextBtn").hidden=true;G.round++;if(G.round<ROUNDS)begin();else finish()};
function begin(){$("roundTitle").textContent=MODE==="sunday"?"Sunday · "+SUN_POS:`Round ${G.round+1} of ${ROUNDS}`;setResult("");drawProgress();startRound(G.round)}
function finish(){
  const total=Math.round(G.results.reduce((a,r)=>a+r.pts,0));
  if(MODE==="day"){PAUSE.done();markPlayed();const w=currentWeek();w.days[GAMEKEY]=total;RS.set("week",w);const h=RS.get("history",[]);h.push({game:GAMEKEY,score:total,week:w.id,at:Date.now()});RS.set("history",h)}
  const share=`The Red Egg · Clutch\n${G.results.map(r=>EMO(r.pts)).join("")}\n${total}/100`;
  const rows=G.results.map((r,i)=>`<tr><td>${i+1}</td><td>${r.label||""}</td><td>${r.detail||""}</td><td>${r.pts.toFixed(1)}</td><td>${pill(r.pts)}</td></tr>`).join("");
  $("end").innerHTML=`<div class="tier">Clutch</div><div class="score">${total}<small>/100</small></div>
    <table><thead><tr><th>Rd</th><th>${COLS[0]}</th><th>${COLS[1]}</th><th>Pts</th><th>Rating</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="share" id="shareText">${share}</div>
    <div class="actions">${MODE==="day"?`<a class="primary" href="index.html">Back to the egg</a>`:`<button class="primary" id="againBtn">Play again</button><a class="ghost" href="index.html">Home</a>`}</div>
    <button class="actions ghost" id="copyBtn" style="width:auto;padding:10px 16px;border-radius:12px;font:700 .95rem var(--body);background:transparent;color:var(--ink);border:1.5px solid var(--line)">Copy result</button><div class="toast" id="toast" aria-live="polite"></div>`;
  $("game").hidden=true;$("progress").hidden=true;$("end").hidden=false;window.scrollTo({top:0,behavior:"smooth"});
  if($("againBtn"))$("againBtn").onclick=()=>{G.round=0;G.results=[];$("end").hidden=true;$("game").hidden=false;$("progress").hidden=false;init&&init();begin()};
  $("copyBtn").onclick=()=>{try{navigator.clipboard.writeText(share).then(()=>$("toast").textContent="Copied",sel)}catch(e){sel()}};
  function sel(){const r=document.createRange();r.selectNodeContents($("shareText"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("toast").textContent="Selected. Copy it to share."}
}
const COLS=["Category","Found"];
const ROUND_SECS=20;
let R,orderQ;
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/&/g," and ").replace(/[^a-z0-9 ]/g,"").replace(/^the /,"").replace(/\s+/g," ").trim();
const squish=s=>norm(s).replace(/ /g,"");
function lev(a,b){if(Math.abs(a.length-b.length)>3)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function matchAnswer(txt,list){
  const raw=squish(txt);if(!raw)return -1;
  // the guess, plus singular versions of it
  const gs=[...new Set([raw,raw.replace(/ies$/,"y"),raw.replace(/es$/,""),raw.replace(/s$/,"")])].filter(Boolean);
  const forms=a=>{const x=squish(a);return [x,x.replace(/ies$/,"y"),x.replace(/es$/,""),x.replace(/s$/,"")]};
  for(let k=0;k<list.length;k++)if(list[k].some(a=>forms(a).some(f=>gs.includes(f))))return k;
  // forgive typos: the longer the word, the more slack
  const tol=n=>n>=11?3:n>=7?2:n>=4?1:0;
  let best=-1,bd=99,tie=false;
  for(let k=0;k<list.length;k++)for(const a of list[k])for(const f of forms(a))for(const g of gs){
    const d=lev(g,f);if(d<bd){bd=d;best=k;tie=false}else if(d===bd&&best!==k)tie=true;
  }
  return best>=0&&!tie&&bd<=tol(Math.min(raw.length,squish(list[best][0]).length))?best:-1;
}
/* each week: five "anyone can do this" categories and one trickier one; Sunday gets one of the easy ones */
function init(){
  const easy=LISTS.filter(l=>l[2]==="easy"),med=LISTS.filter(l=>l[2]!=="easy");
  if(MODE==="practice"){orderQ=shuffle(easy).slice(0,4).concat(shuffle(med).slice(0,1));orderQ=shuffle(orderQ);return}
  const ep=seededOrder(easy,"clutch-easy"),mp=seededOrder(med,"clutch-med"),w=WEEK_NO;
  const e=[0,1,2,3,4].map(k=>ep[(w*5+k)%ep.length]),m=mp[w%mp.length];
  const day=seededOrder([e[0],e[1],e[2],e[3],m],"clutch-week|"+w);
  orderQ=MODE==="sunday"?[e[4]]:day;
}
function eggSmall(c){return `<svg viewBox="0 0 60 80" aria-hidden="true"><path d="${EGGP}" fill="${c}"/><ellipse cx="20" cy="30" rx="6" ry="11" fill="#fff" opacity=".35" transform="rotate(20 20 30)"/></svg>`}
const EGGCOLS=["#F2C230","#F28C28","#3BA55C","#1FA6A0","#2F6FDB","#7A4FD1","#E66BA8","#F4F1EC","#D11F35"];
const BASKET=`<svg viewBox="0 0 330 96" preserveAspectRatio="none" aria-hidden="true">
  <path d="M6 8 Q165 34 324 8 L300 88 Q165 100 30 88 Z" fill="#B9874E"/>
  <path d="M6 8 Q165 34 324 8 L300 88 Q165 100 30 88 Z" fill="none" stroke="#8A5E2E" stroke-width="3"/>
  <g stroke="#8A5E2E" stroke-width="2" opacity=".55" fill="none">
    <path d="M14 30 Q165 54 316 30"/><path d="M20 50 Q165 72 310 50"/><path d="M25 70 Q165 88 305 70"/>
    ${Array.from({length:13},(_,i)=>{const x=30+i*22.5;return `<path d="M${x} ${16+Math.abs(165-x)/14} L${x+(x<165?4:-4)} 90"/>`}).join("")}
  </g>
  <path d="M2 8 Q165 36 328 8" fill="none" stroke="#7A4F22" stroke-width="9" stroke-linecap="round"/>
  <path d="M2 8 Q165 36 328 8" fill="none" stroke="#C99A5F" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>`;
function startRound(i){
  const [name,par,,list]=orderQ[i];
  R={name,par,list,found:[],phase:"ready",t0:0,timer:null};
  $("roundStat").textContent="";
  $("stage").innerHTML=`<div class="cl-top">
      <div class="cat hidden" id="cat"><small>As many as possible</small><b id="catName">${"?????? ????".slice(0,Math.max(6,Math.min(14,name.length)))}</b></div>
      <div class="ring" id="ring"><svg viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="33"/><circle class="fg" id="arc" cx="38" cy="38" r="33" stroke-dasharray="207.3" stroke-dashoffset="0"/></svg><div class="num"><b id="secs">${ROUND_SECS}</b><span>sec</span></div></div>
    </div>
    <div class="guess"><input id="gin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="" disabled aria-label="Your answer"><button id="gbtn" disabled>Add</button></div>
    <div class="flash" id="flash"></div>
    <div class="basket" id="basket"><div class="eggs" id="eggs"></div><div class="front">${BASKET}</div><div class="count"><span id="cnt">0</span></div></div>
    <div class="chips" id="chips"></div>
    <button class="big" id="startBtn">Start</button>`;
  $("startBtn").onclick=go;
  const add=()=>{if(R.phase!=="play")return;const inp=$("gin"),v=inp.value;if(!v.trim())return;inp.value="";
    const k=matchAnswer(v,R.list);inp.classList.remove("bad","dupe");void inp.offsetWidth;
    if(k<0){inp.classList.add("bad");flash("Not on the list",false);return}
    if(R.found.includes(k)){inp.classList.add("dupe");flash(`Already got ${R.list[k][0]}`,false);return}
    R.found.push(k);flash(`${R.list[k][0]}!`,true);pop();dropEgg(R.found.length-1);chip(R.list[k][0],false);$("cnt").textContent=R.found.length};
  $("gin").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
  $("gbtn").onclick=()=>{add();$("gin").focus()};
  hint("");
}
function flash(t,ok){const f=$("flash");f.textContent=t;f.className="flash"+(ok?" ok":"")}
function pop(){const r=$("gin").getBoundingClientRect(),p=document.createElement("div");p.className="plus";p.textContent="+1";p.style.left=(r.right-80)+"px";p.style.top=(r.top-4)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),850)}
// eggs pile up in rows from the bottom of the basket
function dropEgg(n){
  const box=$("eggs"),W=box.clientWidth,per=Math.max(6,Math.floor(W/30)),row=Math.floor(n/per),col=n%per;
  const off=row%2?15:0,x=Math.min(W-30,col*(W-30)/(per-1)+off-(row%2?7:0));
  const e=document.createElement("div");e.className="e";
  e.style.left=x+"px";e.style.bottom=(row*20)+"px";e.style.setProperty("--r",((n*37)%30-15)+"deg");
  e.innerHTML=eggSmall(EGGCOLS[n%EGGCOLS.length]);box.appendChild(e);
}
function chip(t,miss){const c=document.createElement("span");c.textContent=t;if(miss)c.className="miss";$("chips").appendChild(c)}
function go(){
  R.phase="play";R.t0=performance.now();R.wall=Date.now();$("startBtn").hidden=true;
  $("catName").textContent=R.name;$("cat").classList.remove("hidden");
  const inp=$("gin");inp.disabled=false;$("gbtn").disabled=false;inp.placeholder="";inp.focus();
  hint("");
  R.timer=setInterval(()=>{
    const left=Math.max(0,ROUND_SECS-(performance.now()-R.t0)/1000);
    $("secs").textContent=Math.ceil(left);$("arc").setAttribute("stroke-dashoffset",(207.3*(1-left/ROUND_SECS)).toFixed(1));
    $("ring").classList.toggle("low",left<5);
    if(left<=0)stop();
  },50);
}
function stop(){
  clearInterval(R.timer);R.phase="done";
  const inp=$("gin");inp.disabled=true;$("gbtn").disabled=true;inp.blur();
  const missed=shuffle(R.list.map((_,k)=>k).filter(k=>!R.found.includes(k))).slice(0,5);
  missed.forEach(k=>chip(R.list[k][0],true));
  const n=R.found.length,pts=20*Math.min(1,n/R.par);
  roundDone(pts,`${n} in the basket`,{label:R.name,detail:`${n}`});
}

<style id="ux-style">
*{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input,textarea,[contenteditable],.share,#shareText{-webkit-user-select:text;user-select:text}
.htcover{position:fixed;inset:0;z-index:200;background:rgba(10,12,15,.72);display:flex;align-items:center;justify-content:center;padding:16px;animation:htin .18s ease-out}
.htcard{width:100%;max-width:420px;background:var(--surface,#1E232A);color:var(--ink,#EEF1F5);border:1px solid var(--line,#353D47);border-radius:20px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.htcard small{font:700 .72rem var(--body,system-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--muted,#9AA3B0)}
.htcard h2{margin:0;font:400 1.7rem var(--display,system-ui);line-height:1.1}
.htcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.htcard li{position:relative;padding-left:22px;line-height:1.4;font-size:1rem}
.htcard li:before{content:"";position:absolute;left:4px;top:.5em;width:8px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--red,#F0384D)}
.htcard button{margin-top:6px;width:100%;border:0;border-radius:14px;padding:15px;font:700 1.05rem var(--body,system-ui);background:var(--btn,#EEF1F5);color:var(--btn-ink,#14171C);cursor:pointer}
.htopen{display:block;margin:4px auto 0;background:none;border:0;color:var(--muted,#9AA3B0);font:600 .9rem var(--body,system-ui);text-decoration:underline;cursor:pointer;padding:8px}
@keyframes htin{from{opacity:0}to{opacity:1}}
</style>
<script id="ux-how">(function(){
