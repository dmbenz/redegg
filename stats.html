<title>Red Egg Stats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

/* Layout: one 560px column per page; brand header, page content as cards, tab bar fixed at the bottom on phones and a pill row under the header on wider screens */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --tray:#DCE1E6; --ink:#1A1D23; --muted:#5E6673;
  --line:#C9D0D8; --red:#D11F35; --red-dark:#8E1222; --crack:#3A0A12; --good:#2E9B57; --btn:#1A1D23; --btn-ink:#FFFFFF;
  --glow:#F6C343; --chick:#F2C230; --hole:#1A0509;
  --t1:#B98500; --t2:#2E9B57; --t3:#2F6FDB; --t4:#7A6F62; --t5:#8A5A3C;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171C; --surface:#1E232A; --tray:#262C34; --ink:#EEF1F5; --muted:#9AA3B0;
  --line:#353D47; --red:#F0384D; --red-dark:#A01A2D; --crack:#2A060C; --good:#47C474; --btn:#EEF1F5; --btn-ink:#14171C;
  --glow:#FFCF4D; --chick:#FFD34D; --hole:#120306; --t1:#FFC93C; --t2:#47C474; --t3:#6EA0FF; --t4:#B3A898; --t5:#C08A66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171C; --surface:#1E232A; --tray:#262C34; --ink:#EEF1F5; --muted:#9AA3B0;
  --line:#353D47; --red:#F0384D; --red-dark:#A01A2D; --crack:#2A060C; --good:#47C474; --btn:#EEF1F5; --btn-ink:#14171C;
  --glow:#FFCF4D; --chick:#FFD34D; --hole:#120306; --t1:#FFC93C; --t2:#47C474; --t3:#6EA0FF; --t4:#B3A898; --t5:#C08A66; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.meta{flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--red)}
.meta{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;text-align:right}
.meta b{display:block;color:var(--ink);font-size:.95rem;letter-spacing:.02em;text-transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
h3{margin:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* the egg */
.eggcard{align-items:center;text-align:center}
.egg{width:220px;height:253px;position:relative;margin-top:44px}
.egg svg{width:100%;height:100%;overflow:visible}
.egg .body{transform-origin:50% 95%}
.egg.wob1 .body{animation:wob1 .45s ease-in-out 2}
.egg.wob2 .body{animation:wob2 .22s ease-in-out 4}
@keyframes wob1{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes wob2{25%{transform:rotate(-9deg) translateY(-3px)}75%{transform:rotate(9deg) translateY(-3px)}}
.egg .ring{stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset .55s ease-in}
.egg.cracked .ring{stroke-dashoffset:0}
.egg.cracked.partial .ring{stroke-dashoffset:150}
.egg .top{transform-box:view-box;transform-origin:30% 50%;transition:transform 1.1s cubic-bezier(.15,.8,.3,1),opacity .5s ease .6s}
.egg.open .top{transform:translate(-70px,-150px) rotate(-70deg);opacity:0}
.egg .shard{opacity:0;transform-box:fill-box;transform-origin:center}
.egg.open .shard{animation:shard .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes shard{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.egg .chick{opacity:0;transform-box:view-box;transform-origin:50% 75%;transform:translateY(60px) scale(.5)}
.egg.open .chick{animation:pop .8s cubic-bezier(.3,1.7,.5,1) .25s forwards}
@keyframes pop{0%{opacity:1;transform:translateY(60px) scale(.5)}70%{opacity:1;transform:translateY(-44px) scale(1.04)}100%{opacity:1;transform:translateY(-36px)}}
.egg .spark{opacity:0;transform-box:fill-box;transform-origin:center}
.egg.open .spark{animation:twinkle 1.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.egg .peek{opacity:0;transition:opacity .4s ease .2s}
.egg.peeking .peek{opacity:1}
.egg .peek .eyes{animation:blink 3.2s infinite 1s;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.egg .seg{transition:stroke-dashoffset .3s ease-out}
.egg.static *{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
.egg.static.open .spark{animation:twinkle 1.6s ease-in-out infinite!important;animation-delay:var(--d)!important}
.tiername{font-family:var(--display);font-size:1.8rem;line-height:1.1;min-height:1.1em}
.points{font:700 1rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.points b{color:var(--ink);font-size:1.4rem}
.status{color:var(--muted);max-width:40ch;margin:0}
.big{width:100%;border:0;border-radius:14px;padding:16px;font:700 1.05rem var(--body);cursor:pointer;background:var(--btn);color:var(--btn-ink)}

/* days */
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dn{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day .gn{font-weight:700;min-width:0}
.day .gn small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.day .today{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--surface);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.day.sun .gn{color:var(--red)}
.sc{font:700 1rem var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.play{font:700 .9rem var(--body);border:0;border-radius:10px;padding:9px 14px;background:var(--btn);color:var(--btn-ink);cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block}
.play.red{background:var(--red);color:#fff}
.play.re{background:transparent;color:var(--muted);border:1.5px solid var(--line);padding:4px 9px;font-size:.75rem;margin-left:8px}
.soon{font-size:.8rem;color:var(--muted);font-weight:600}

/* collection */
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{font:inherit;color:inherit;border:2px solid transparent;cursor:pointer;background:var(--tray);border-radius:14px;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.slot svg{width:70px;height:70px}
.slot.sel{border-color:var(--ink)}
.slot.locked{cursor:default}
.detail{background:var(--tray);border-radius:14px;padding:14px 16px}
.detail h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:1.2rem}
.detail ul{list-style:none;margin:0;padding:0}
.detail li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.detail li:last-child{border-bottom:0}
.detail li b{font-family:var(--mono)}
.slot .nm{font-size:.74rem;font-weight:700;line-height:1.2}
.slot.locked .nm{color:var(--muted)}
.slot .ct{position:absolute;top:6px;right:8px;font:700 .72rem var(--mono);color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hist li:last-child{border-bottom:0}
.hist b{font-family:var(--mono)}
.hist span:first-child{color:var(--muted)}
.empty{color:var(--muted);margin:0;font-size:.92rem}
details{font-size:.9rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pickwrap{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:.85rem}
.pickwrap select{font:600 .85rem var(--body);padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.tools button{font:600 .85rem var(--body);border-radius:10px;padding:9px 12px;background:transparent;color:var(--ink);border:1.5px solid var(--line);cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (max-width:400px){.coll{grid-template-columns:repeat(3,1fr);gap:7px}.slot svg{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.egg.open .chick{opacity:1;transform:translateY(-36px)}.egg.open .spark{opacity:1;transform:none}}

/* ---------- site chrome ---------- */
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.brand{text-decoration:none;color:inherit}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs a{white-space:nowrap;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.02em}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg .fillme{fill:var(--red)}
@media (min-width:720px){
  body{padding-bottom:40px}
  .tabs{position:static;background:transparent;border:0;padding:0;margin:-6px auto 0;max-width:560px}
  .tabs .in{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
  .tabs a{flex-direction:row;justify-content:center;gap:7px;font-size:.88rem;padding:9px 10px;border-radius:999px}
  .tabs a svg{width:19px;height:19px}
  .tabs a[aria-current="page"]{background:var(--tray)}
}
footer.site{text-align:center;color:var(--muted);font-size:.8rem;padding-top:6px}
footer.site b{font-family:var(--display);font-weight:400;color:var(--ink)}
footer.site .beta{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h2{font-size:2rem}
.pagehead p{margin:0;color:var(--muted);max-width:52ch}
.link{color:var(--ink);font-weight:700;text-decoration:none;font-size:.92rem}
.link:hover{text-decoration:underline}

/* home */
a.big{display:block;text-align:center;text-decoration:none}
.big.red{background:var(--red);color:#fff}
.today{width:100%}
.todaynote{margin:0;background:var(--tray);border-radius:12px;padding:12px 14px;color:var(--muted)}
.todaynote b{color:var(--ink);font-family:var(--mono)}
.teaser{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--tray);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);font-size:.74rem;font-weight:700}
.mini svg{width:64px;height:64px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--tray);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile b{font:700 1.7rem var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.tile small{color:var(--muted);font-size:.8rem}
.gtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gtable th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.gtable td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:.92rem}
.gtable th:first-child,.gtable td:first-child{text-align:left;font-family:var(--body);font-weight:700}
.gtable tr:last-child td{border-bottom:0}
.meter{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--tray);vertical-align:middle;margin-left:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:3px}
.chartwrap{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}

/* how to play */
.how h3{font-size:.75rem;margin-top:4px}
.how p{margin:0;max-width:60ch}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:2.8em 1fr;gap:12px;align-items:start}
.steps .dn{font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.92rem}
.steps li.sun b{color:var(--red)}
.ratings{display:flex;flex-wrap:wrap;gap:6px}
.rpill{display:inline-block;font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq details:last-child{border-bottom:0}
.faq summary{font-size:.98rem}
.faq p{margin:.4em 0 0}

/* week rows: today, locked, missed */
.day{padding-left:10px;padding-right:10px;margin:0 -10px;border-radius:12px}
.day.is-today{border:2px solid var(--red);margin:4px -10px}
.day.locked .gn,.day.locked .dn,.day.missed .gn,.day.missed .dn{opacity:.4}
.lockic{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.day.sun.locked .gn{color:var(--ink)}
.egg .crackline{transition:opacity .3s ease}
.egg.open .crackline{opacity:0}
.unlockrow{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);font-size:.85rem}

/* an unbroken shell sits under the two halves so no seam shows until it opens */
.egg.open .whole{opacity:0}

/* the Red Egg row keeps its look even when locked */
.day.sun .gn{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--red);letter-spacing:.01em}
.day.sun .dn{color:var(--red)}
.day.sun.locked .gn,.day.sun.locked .dn{opacity:1;color:var(--red)}
.day.sun:not(.is-today){background:color-mix(in srgb,var(--red) 7%,transparent)}

.demos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo{background:var(--tray);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.demo b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.demo span{color:var(--muted);font-size:.82rem;line-height:1.3}
@media (hover:hover){.demo:hover{outline:2px solid var(--ink)}}

.slot.special:not(.locked){background:linear-gradient(135deg,color-mix(in srgb,var(--glow) 30%,var(--tray)),var(--tray))}
.coll2{grid-template-columns:repeat(3,1fr)}

/* rarity colors */
:root{--r-mythic:#7A4FD1;--r-legendary:#B98500;--r-epic:#8E44C9;--r-rare:#2F6FDB;--r-uncommon:#2E9B57;--r-common:#6B7480;--r-rough:#8A5A3C;--r-secret:#D14F8E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--r-legendary:#FFC93C;--r-epic:#C08BFF;--r-rare:#6EA0FF;--r-uncommon:#47C474;--r-common:#9AA3B0;--r-rough:#C08A66;--r-secret:#FF8FC4;--r-mythic:#B9A2FF}}
:root[data-theme="dark"]{--r-legendary:#FFC93C;--r-epic:#C08BFF;--r-rare:#6EA0FF;--r-uncommon:#47C474;--r-common:#9AA3B0;--r-rough:#C08A66;--r-secret:#FF8FC4;--r-mythic:#B9A2FF}
.rar{display:inline-block;font:700 .62rem var(--body);text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor;vertical-align:middle;white-space:nowrap}
.r-mythic{border-color:transparent;background:linear-gradient(90deg,#8FE3FF,#C9B8FF,#FF9BD2) border-box;background-origin:border-box;color:#2A1B4F}
.r-legendary{color:var(--r-legendary)}.r-epic{color:var(--r-epic)}.r-rare{color:var(--r-rare)}.r-uncommon{color:var(--r-uncommon)}
.r-common{color:var(--r-common)}.r-rough{color:var(--r-rough)}.r-cursed{color:#fff;background:#2B2F35;border-color:#2B2F35}.r-secret{color:var(--r-secret)}
.slot{gap:4px}
.slot.b-mythic{border-color:#B9A2FF}.slot.b-legendary{border-color:var(--r-legendary)}.slot.b-epic{border-color:var(--r-epic)}.slot.b-rare{border-color:var(--r-rare)}

  -webkit-mask:radial-gradient(circle,#000 62%,transparent 71%);mask:radial-gradient(circle,#000 62%,transparent 71%)}

.bpsky i:nth-child(6){left:93%;top:16%;animation-delay:.2s}.bpsky i:nth-child(7){left:33%;top:80%;animation-delay:1.1s;width:2px;height:2px}

<script>
/* ---- daily rules shared by every page: same puzzle for everyone, one play per day, streaks ---- */
const DAY_KEYS=["blind-stop","clutch","flash","trivia","bridge","pecking-order","sunday"];
const DAY_NAMES=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
/* testing only: "Pretend it's Sunday" moves today to this week's Sunday */
const FAKE_SUNDAY=(()=>{try{return false}catch(e){return false}})();
/* testing only: "Next week" jumps the calendar ahead a week at a time */
const WEEK_SHIFT=(()=>{try{return Math.max(0,0)}catch(e){return 0}})();
const REAL_NOW=(()=>{const d=new Date();d.setDate(d.getDate()+7*WEEK_SHIFT);if(FAKE_SUNDAY)d.setDate(d.getDate()+(6-(d.getDay()+6)%7));return d})(),REAL_DAY=ymd(REAL_NOW);
/* missed Sunday? On Monday you can still crack last week's egg: the site steps back to Sunday for that week */
/* missed Sunday? last week's egg waits: on Monday you can still play its Red Egg, and after that you hatch it yourself (Sunday counts 0).
   While you're looking at it, the site steps back to that week's Sunday. */
var GRACE_ID=(()=>{try{const g=JSON.parse(localStorage.getItem("redegg2:grace")||"null");if(!g||typeof g!=="object"||g.day!==REAL_DAY||!/^\d{4}-\d{2}-\d{2}$/.test(g.id||""))return null;
  const rm=new Date(REAL_NOW);rm.setDate(rm.getDate()-(rm.getDay()+6)%7);return g.id<ymd(rm)?g.id:null}catch(e){return null}})();
var GRACE=!!GRACE_ID;
const NOW=(()=>{const d=new Date(REAL_NOW);if(GRACE){const s=new Date(GRACE_ID+"T12:00:00");s.setDate(s.getDate()+6);d.setFullYear(s.getFullYear(),s.getMonth(),s.getDate())}return d})(),LOCALDAY=ymd(NOW),TODAY_IDX=(NOW.getDay()+6)%7;
const CUR_MONDAY=(()=>{const d=new Date(NOW);d.setDate(d.getDate()-TODAY_IDX);return ymd(d)})();
const WEEK_NO=Math.round((new Date(CUR_MONDAY+"T12:00:00")-new Date("2026-01-05T12:00:00"))/604800000);
/* the date a day's game belongs to this week, so a catch-up gets the same puzzle everyone played that day */
function gameDate(key){const i=DAY_KEYS.indexOf(key);const d=new Date(CUR_MONDAY+"T12:00:00");d.setDate(d.getDate()+Math.max(0,i));return ymd(d)}
const SUN_KEYS=["blind-stop","clutch","flash","trivia","bridge","pecking-order"];
/* the Claude preview gets its own puzzles so practicing there never spoils the live week (the live build blanks this) */
const SEED_SALT="";
function hashStr(s){s=String(s)+SEED_SALT;let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rngFrom(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seededOrder(list,salt){const r=rngFrom(hashStr(salt)),a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const wkKey=k=>k==="week"&&GRACE?"lastEgg":k;
const RS={get(k,d){k=wkKey(k);try{const v=localStorage.getItem("redegg2:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){k=wkKey(k);try{localStorage.setItem("redegg2:"+k,JSON.stringify(v))}catch(e){}}};
/* a new egg every Monday */
function currentWeek(){let w=RS.get("week",null);if(!w||!w.id||w.id!==CUR_MONDAY){
    /* an egg that never cracked waits for Monday's catch-up, or hatches on its own after that */
    if(!GRACE&&w&&w.id&&w.id<CUR_MONDAY&&Object.keys(w.days||{}).length&&!RS.get("pen",[]).some(p=>p.id===w.id)){
      /* only one egg waits at a time: an even older one that was never hatched hatches quietly (Sunday 0) */
      const old=RS.get("lastEgg",null);if(old&&old.id&&old.id!==w.id)quietHatch(old);RS.set("lastEgg",w)}
    w={id:CUR_MONDAY,days:{},sunday:{}};RS.set("week",w)}w.days=w.days||{};w.sunday=w.sunday||{};return w}
function quietHatch(le){try{const pen=RS.get("pen",[]);if(pen.some(p=>p.id===le.id))return;
  const r=v=>Math.round((+v||0)*10)/10,s=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0),sun=r(s(le.sunday)),total=Math.round(s(le.days)+sun),t=tierFor(total);
  pen.push({id:le.id,total,key:t.key});pen.sort((a,b)=>a.id<b.id?-1:1);RS.set("pen",pen);
  const days={};Object.keys(le.days||{}).forEach(k=>days[k]=r(le.days[k]));const wk=RS.get("lbWeeks",{});wk[le.id]={days,sun,chick:t.key,total};RS.set("lbWeeks",wk)}catch(e){}}
function markPlayed(){const s=RS.get("playDays",[]);if(!s.includes(LOCALDAY)){s.push(LOCALDAY);RS.set("playDays",s)}Promise.resolve().then(lbQuick);if(location.hash==="#day")keepResult()}
/* keep the finished results screen, so you can open the game again this week to see it or share it */
const pageKey=()=>(location.pathname.split("/").pop()||"").replace(/\.html$/,"");
function keepResult(){
  const key=pageKey();if(!DAY_KEYS.includes(key))return;let n=0;
  const grab=()=>{const end=document.getElementById("end"),st=document.getElementById("shareText");
    if(end&&!end.hidden&&st&&st.textContent.trim()){
      try{Object.keys(localStorage).forEach(k=>{if(k.startsWith("redegg2:res:")&&!k.startsWith("redegg2:res:"+CUR_MONDAY))localStorage.removeItem(k)})}catch(e){}
      const r={html:end.innerHTML,share:st.textContent};RS.set("res:"+CUR_MONDAY+":"+key,r);
      /* also keep it with your week on the server, so your other phone or computer can show the same screen */
      const w=currentWeek();w.res=w.res||{};w.res[key]=r;RS.set("week",w);lbQuick();dcWire(document.getElementById("copyBtn"),key,r.share);dcOrder(end);return}
    if(++n<40)setTimeout(grab,250)};
  setTimeout(grab,30);
}
function showResult(key,name){
  const r=RS.get("res:"+CUR_MONDAY+":"+key,null)||(currentWeek().res||{})[key];if(!r||!r.html)return false;
  const wrap=document.querySelector(".wrap");if(!wrap||document.getElementById("gateMsg"))return true;
  [...wrap.children].forEach(el=>{if(el.tagName!=="HEADER")el.hidden=true});
  wrap.insertAdjacentHTML("beforeend",`<section class="card end" id="gateMsg">${r.html}</section>`);
  const box=document.getElementById("gateMsg"),share=r.share.includes("redegg.app")?r.share:r.share+"\nredegg.app";
  /* the same screen you saw at the end: only the buttons that would start a new game are taken out */
  box.querySelectorAll("button").forEach(b=>{if(b.id!=="copyBtn")b.remove()});
  box.querySelectorAll("a").forEach(a=>{const h=a.getAttribute("href")||"";if(h.includes("#")&&!/index\.html/.test(h))a.remove()});
  box.querySelectorAll("[id]").forEach(el=>{if(el.id!=="copyBtn"&&el.id!=="toast")el.removeAttribute("id")});
  const cp=box.querySelector("#copyBtn"),toast=box.querySelector("#toast");
  dcWire(cp,key,share);
  dcRow(box);
  if(toast){toast.style.minHeight="0";toast.style.margin="0"}
  try{PAUSE.done()}catch(e){}
  return true;
}
/* the moment a game is finished, send it to the server, so your other phone or computer knows you played */
function lbQuick(){try{
  if(GRACE){try{lbSync()}catch(e){}return}
  if(window.claude||WEEK_SHIFT)return;const id=RS.get("lbId",null),secret=RS.get("lbSecret",null),name=RS.get("lbName","");if(!id||!secret||!name)return;
  const w=currentWeek(),r=v=>Math.round((+v||0)*10)/10,days={};Object.keys(w.days).forEach(k=>days[k]=r(w.days[k]));
  const sun=Object.keys(w.sunday).length?r(Object.values(w.sunday).reduce((a,b)=>a+(+b||0),0)):null;
  const tot=Math.round(Object.values(w.days).reduce((a,b)=>a+(+b||0),0)+(sun||0));
  fetch("/api/players",{method:"POST",keepalive:true,headers:{"content-type":"application/json"},body:JSON.stringify({id,secret,name,weeks:{[w.id]:{days,sun,chick:null,total:tot}},save:{week:w}})}).catch(()=>{});
}catch(e){}}
function dayStreak(){const s=new Set(RS.get("playDays",[]));const d=new Date(NOW);if(!s.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(s.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function bestDayStreak(){const s=[...new Set(RS.get("playDays",[]))].sort();let best=0,run=0,prev=null;for(const k of s){const d=new Date(k+"T12:00:00");run=prev&&Math.round((d-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=d}return best}
function weekStreak(){const ids=new Set(RS.get("pen",[]).map(p=>p.id));const d=new Date(CUR_MONDAY+"T12:00:00");if(!ids.has(ymd(d)))d.setDate(d.getDate()-7);let n=0;while(ids.has(ymd(d))){n++;d.setDate(d.getDate()-7)}return n}
/* the week is ready for Sunday once Mon–Sat are all played (catch-ups count) */
function weekReady(w){return Object.keys(w.sunday||{}).length>0||SUN_KEYS.every(k=>k in w.days)}
/* stop replays and off-day plays (testing can unlock every day) */
function dailyGate(mode,key,name){
  if(mode==="practice"||false)return false;
  const w=currentWeek();let msg=null;
  if(mode==="day"){
    if(key in w.days)msg=`You already played today's ${name}. You scored <b>${Math.round(w.days[key])}</b>. A new puzzle is waiting tomorrow.`;
    else if(DAY_KEYS.indexOf(key)>TODAY_IDX)msg=`${name} is ${DAY_NAMES[DAY_KEYS.indexOf(key)]}'s game. It unlocks on ${DAY_NAMES[DAY_KEYS.indexOf(key)]}.`;
    else if(SUN_KEYS.every(k=>k in w.sunday))msg=`This week's egg has already hatched, so ${name} can't be caught up. A new egg starts Monday.`;
  }else if(mode==="sunday"){
    if(TODAY_IDX!==6)msg=`The Red Egg is played on Sunday.`;
    else if(!weekReady(w))msg=`Finish the week first. Play your missed days, then come back for the Red Egg.`;
    else if(key in w.sunday)msg=`You already played this round of the Red Egg.`;
    else{const nx=SUN_KEYS.find(k=>!(k in w.sunday));if(nx&&nx!==key){location.replace(nx+".html#sunday");return true}}
  }
  if(!msg){remoteGate(mode,key,name);return false}
  if(mode==="day"&&key in w.days){if(!showResult(key,name))showSummary(key,name,w.days[key]);return true}
  gateShow(msg);return true;
}
/* already played on your other phone or computer? the server knows, even if this browser doesn't yet */
function remoteGate(mode,key,name){
  if(mode!=="day"||window.claude)return;const id=RS.get("lbId",null);if(!id)return;
  fetch("/api/friends",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,secret:RS.get("lbSecret",""),action:"me"})}).then(r=>r.ok?r.json():null).then(d=>{
    const me=d&&d.me,wk=me&&me.weeks&&me.weeks[CUR_MONDAY];
    if(!wk||!wk.days||!(key in wk.days))return;
    const w=currentWeek();if(key in w.days)return;w.days[key]=wk.days[key];RS.set("week",w);
    try{PAUSE.done()}catch(e){}
    if(!showResult(key,name))showSummary(key,name,wk.days[key]);
  }).catch(()=>{});
}
/* no saved results screen here (an older game, or played on another device): a simple summary you can still share */
function showSummary(key,name,score){
  if(document.getElementById("gateMsg"))return;
  const sc=Math.round(+score||0),tier=sc>=95?["Perfect Yolk","🟨"]:sc>=75?["Sunny Side Up","🟩"]:sc>=50?["Over Easy","🟦"]:sc>=25?["Cracked","⬜"]:["Rotten Egg","🟫"];
  const share=`The Red Egg · ${name}\n${gameDate(key)}\n${tier[1]} ${sc}/100\nredegg.app`;
  const wrap=document.querySelector(".wrap");[...wrap.children].forEach(el=>{if(el.tagName!=="HEADER")el.hidden=true});
  wrap.insertAdjacentHTML("beforeend",`<section class="card end" id="gateMsg" style="align-items:center;text-align:center;gap:12px">
    <p style="margin:0;font-weight:800;color:var(--muted,#7A5636)">You already played this week's ${name}.</p>
    <div class="tier">${name}</div><div class="score">${sc}<small>/100</small></div><div style="font-weight:800">${tier[1]} ${tier[0]}</div>
    <div class="share" id="shareText">${share}</div>
    <button id="sumCopy" style="width:100%;border:0;cursor:pointer;border-radius:16px;padding:16px;font:700 1.05rem var(--body);background:var(--red,#D62F3C);color:#fff">Share</button><div class="toast" id="toast" aria-live="polite"></div>
    <a href="index.html" style="display:block;width:100%;text-align:center;text-decoration:none;border-radius:16px;padding:16px;font:700 1.05rem var(--body);background:var(--btn);color:var(--btn-ink)">Back to the egg</a></section>`);
  document.getElementById("sumCopy").onclick=()=>openDayCard(key,share);
  try{PAUSE.done()}catch(e){}
}
function gateShow(msg){
  if(document.getElementById("gateMsg"))return;
  const wrap=document.querySelector(".wrap");
  [...wrap.children].forEach(el=>{if(el.tagName!=="HEADER")el.hidden=true});
  wrap.insertAdjacentHTML("beforeend",`<section class="card" id="gateMsg" style="align-items:center;text-align:center;gap:16px"><p style="margin:0;font-size:1.05rem;max-width:36ch">${msg}</p><a href="index.html" style="display:block;width:100%;text-align:center;text-decoration:none;border-radius:16px;padding:16px;font:700 1.05rem var(--body);background:var(--btn);color:var(--btn-ink)">Back to the egg</a></section>`);
  return true;
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
/* This week's crack network: a jagged fracture around the egg (where it will break), branches off it,
   and separate impact points all over the shell. Segments are ordered the way they appear. */
function buildNet(seed){
  // one jagged crack running left to right across the middle of the egg
  const r=mulberry(hash("crack3-"+seed));
  const RN=31,nodes=[];
  for(let i=0;i<RN;i++){const x=10+i*(180/(RN-1));nodes.push([x,118+(i%2?-1:1)*(2.5+r()*5.5)+(r()-.5)*4])}
  return {nodes};
}
function clipPaths(net){
  const pts=net.nodes.map(([x,y])=>`L${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  const rev=net.nodes.slice().reverse().map(([x,y])=>`L${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  return `<clipPath id="ct"><path d="M0 0 L200 0 ${rev} Z"/></clipPath>
    <clipPath id="cb"><path d="M0 240 ${pts} L200 240 Z"/></clipPath>
    <clipPath id="cs"><path d="${SHELL}"/></clipPath>`;
}

    p.style.transition="none";p.setAttribute("stroke-dashoffset",(1000*(1-fromFrac)).toFixed(1));

      cache=null;el("nameAvail").hidden=true;
      if(o.onDone)o.onDone(mode);
    }catch(e){
      const c=e.message;
      if(c==="taken"){el("nameAvail").hidden=true;showErr("That username is taken. "+linkHint)}
      else showErr(c==="wrong"?"Wrong username or password.":c==="no_password"?"You haven't set a password yet. Open The Red Egg where you usually play, set a password there, then log in here.":c==="slow_down"?"Too many tries. Wait a few minutes.":c==="short_password"?"Pick a password with at least 4 characters.":c==="badcode"?"That code didn't work.":c==="account"?"That code is for a different account.":c==="other"?"Can't log in as another player in this preview.":c==="not_found"?"No player by that name.":"Couldn't connect. Try again.");
    }finally{el("nameSave").disabled=false}
  }
  /* a real form, so the phone offers to save the password (iCloud Keychain, Google Password Manager) */
  if(el("nameForm"))el("nameForm").onsubmit=e=>{e.preventDefault();submit()};else el("nameSave").onclick=submit;
  el("nameIn").oninput=()=>{el("nameErr").hidden=true;clearTimeout(timer);timer=setTimeout(check,350)};
  el("swapMode").onclick=()=>{const t=(SCREENS[mode]||{}).to;if(t){setMode(t);el("nameIn").focus()}};
  if(el("codeMode"))el("codeMode").onclick=()=>{setMode("link");el("nameIn").focus()};
  if(el("authBack"))el("authBack").onclick=()=>setMode("choose");
  if(el("cancelName"))el("cancelName").onclick=()=>{el("nameCard").hidden=true;if(o.onCancel)o.onCancel()};
  if(el("laterBtn"))el("laterBtn").onclick=()=>{RS.set("lbLater",REAL_DAY);el("nameCard").hidden=true};
  return {setMode};
}

/* Suggest a puzzle: send an idea; the admin reads them in the gear's Ideas inbox */
LB.suggest=async function(kind,text){
  const b=await this.init();if(!b)throw new Error("off");if(!lbName())throw new Error("signin");
  text=String(text||"").trim().slice(0,600);if(text.length<3)throw new Error("empty");
  if(b.kind==="claude"){
    const ref=b.db.doc("players/"+b.id),s=await ref.get();if(!s.exists)throw new Error("signin");
    const d=s.data()||{},day=new Date().toISOString().slice(0,10),ideas=(d.ideas||[]).slice(-40);
    if(ideas.filter(x=>x.day===day).length>=5)throw new Error("limit");
    ideas.push({kind,text,at:Date.now(),day});await ref.set({...d,ideas});return true;
  }
  const r=await fetch("/api/suggest",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:b.id,secret:b.secret,kind,text})});
  if(r.ok)return true;let e="off";try{e=(await r.json()).error||e}catch(x){}throw new Error(e);
};
LB.ideas=async function(){
  const b=await this.init();if(!b)throw new Error("off");const pin=RS.get("adminPin","");if(!pin)throw new Error("bad_pin");
  if(b.kind==="claude"){if(pin!=="1234")throw new Error("bad_pin");
    const s=await b.db.collection("players").get(),out=[];
    s.docs.forEach(doc=>{const d=doc.data()||{};(d.ideas||[]).forEach((x,i)=>out.push({key:doc.id+"|"+i,id:doc.id,name:d.name||"",kind:x.kind,text:x.text,at:x.at}))});
    return out.sort((a,c)=>c.at-a.at)}
  const r=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pin,action:"suggestions"})});
  if(!r.ok)throw new Error("off");return (await r.json()).suggestions||[];
};
LB.ideaDone=async function(key){
  const b=await this.init();if(!b)throw new Error("off");const pin=RS.get("adminPin","");
  if(b.kind==="claude"){const [id,i]=String(key).split("|"),ref=b.db.doc("players/"+id),s=await ref.get();if(!s.exists)return;const d=s.data()||{},ideas=(d.ideas||[]).slice();ideas.splice(+i,1);await ref.set({...d,ideas});return}
  await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pin,action:"suggestDel",key})});
};

const HOW_HTML="  <div class=\"pagehead\"><h2>How to play</h2><p>One egg a week. A new game every day. Play well, crack it open on Sunday, and see what hatches.</p></div>\n\n  <section class=\"card how\">\n    <h2>The week</h2>\n    <p>Each day has its own game. Every game is worth up to 100 points, and every point you earn cracks the egg a little more.</p>\n    <ul class=\"steps\">\n      <li><span class=\"dn\">Mon</span><div><b>Blind Stop</b><span>Stop the clock at the target time. The clock disappears, so you have to feel it. The closer you stop, the more points.</span></div></li>\n      <li><span class=\"dn\">Tue</span><div><b>Clutch</b><span>Each round has a hidden category, like candy bars or things at the beach. Name as many as you can in 20 seconds. Small typos are fine.</span></div></li>\n      <li><span class=\"dn\">Wed</span><div><b>Flash</b><span>Some eggs in the carton glow for half a second. Tap the ones you remember. Right picks earn points; wrong picks cost them.</span></div></li>\n      <li><span class=\"dn\">Thu</span><div><b>Egghead</b><span>One question each from Sports, Movies &amp; TV, Music, History &amp; Geography and a Wild Card. Find the right answer fast. Wrong taps add time.</span></div></li>\n      <li><span class=\"dn\">Fri</span><div><b>Link</b><span>Build a chain of five words, each one joining onto the last: SUN \u2192 FLOWER \u2192 POT \u2192 HOLE. Solve each link fast. Hints help but add time.</span></div></li>\n      <li><span class=\"dn\">Sat</span><div><b>Pecking Order</b><span>Put five things in order, like oldest to newest. Anything in the right spot locks in green, so you can work out the rest. Fewer tries, more points.</span></div></li>\n      <li class=\"sun\"><span class=\"dn\">Sun</span><div><b>The Red Egg</b><span>One round of every game, back to back, worth 20 points each. Then the egg cracks open.</span></div></li>\n    </ul>\n  </section>\n\n  <section class=\"card how\">\n    <h2>Every round is rated</h2>\n    <p>Each game has 5 rounds worth up to 20 points each. After every round you'll see how you did.</p>\n    <div class=\"ratings\"><span class=\"rpill\" style=\"color:var(--t1)\">Perfect Yolk</span><span class=\"rpill\" style=\"color:var(--t2)\">Sunny Side Up</span><span class=\"rpill\" style=\"color:var(--t3)\">Over Easy</span><span class=\"rpill\" style=\"color:var(--t4)\">Cracked</span><span class=\"rpill\" style=\"color:var(--t5)\">Rotten Egg</span></div>\n  </section>\n\n  <section class=\"card how\">\n    <h2>Hatching</h2>\n    <p>On Sunday, your whole week decides what hatches. A strong week cracks the egg wide open. A rough one might only crack a little, and something may just peek out.</p>\n    <p>There are 18 chicks to collect, plus a few secret ones. Each stays a mystery until you hatch it. Every chick has a rarity, so you can tell at a glance who had the better week:</p>\n    <div class=\"ratings\"><span class=\"rar r-legendary\">Legendary</span><span class=\"rar r-epic\">Epic</span><span class=\"rar r-rare\">Rare</span><span class=\"rar r-uncommon\">Uncommon</span><span class=\"rar r-common\">Common</span><span class=\"rar r-rough\">Rough</span><span class=\"rar r-cursed\">Cursed</span></div>\n  </section>\n\n  <section class=\"card how faq\">\n    <h2>Questions</h2>\n    <details><summary>When does a new egg start?</summary><p>Every Monday. Sunday is always the hatch.</p></details>\n    <details><summary>What if I miss a day?</summary><p>You can go back and play any day you missed, as long as this week's egg hasn't hatched yet. You'll get the same puzzle everyone else played that day. You can't play ahead, though: each game unlocks on its own day. The Red Egg opens once the rest of your week is done.</p></details>\n    <details><summary>Does everyone get the same games?</summary><p>Yes. Everyone plays the same puzzles each day.</p></details>\n    <details><summary>Where are my scores saved?</summary><p>On this device. To play on another phone or computer, tap the gear at the top, then Account, then Link a device.</p></details>\n  </section>\n";

const PAGE_VIEW="you";
(function(){
  const pen=STORE.get("pen",[]),hist=history(),w=getWeek();
  const thisWeek=Math.round(sum(w.days)+sum(w.sunday));
  const best=pen.length?pen.reduce((a,b)=>b.total>a.total?b:a):null;
  const avg=pen.length?Math.round(pen.reduce((a,b)=>a+b.total,0)/pen.length):null;
  const tile=(label,val,sub)=>`<div class="tile"><span>${label}</span><b>${val}</b>${sub?`<small>${sub}</small>`:""}</div>`;
  $("tiles").innerHTML=tile("This week",thisWeek,"points so far")
    +tile("Best week",best?best.total:"–",best?ALL_CHICKS.find(t=>t.key===penKey(best)).name:"No eggs hatched yet")
    +tile("Average week",avg??"–",pen.length?`over ${pen.length} week${pen.length===1?"":"s"}`:"")
    +tile("Games played",hist.length,hist.length?"daily games":"")
    +tile("Day streak",`🔥 ${dayStreak()}`,`best ${bestDayStreak()}`)
    +tile("Weeks hatched",weekStreak(),"in a row");
  // recent weeks
  const recent=pen.slice(-8);
  if(!recent.length){$("chart").innerHTML=`<p class="empty">Your weekly scores show up here after your first Sunday.</p>`}
  else{
    const W=360,H=170,pad=26,bw=Math.min(34,(W-pad)/recent.length-10);
    const x=i=>pad+i*((W-pad)/recent.length)+((W-pad)/recent.length-bw)/2,y=v=>H-24-(v/720)*(H-48);
    const grid=[0,360,720].map(v=>`<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono, monospace">${v}</text>`).join("");
    const bars=recent.map((p,i)=>{const t=ALL_CHICKS.find(x=>x.key===penKey(p)),last=i===recent.length-1;
      return `<rect x="${x(i)}" y="${y(p.total)}" width="${bw}" height="${y(0)-y(p.total)}" rx="5" fill="${last?"var(--red)":"var(--ink)"}" opacity="${last?1:.75}"/>
        <text x="${x(i)+bw/2}" y="${y(p.total)-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono, monospace">${p.total}</text>
        <text x="${x(i)+bw/2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="Figtree, sans-serif">${label(new Date(p.id+"T12:00:00"))}</text>`}).join("");
    $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recent weekly scores">${grid}${bars}</svg>`;
  }
  // by game
  const games=DAYS.filter(d=>!d.soon);
  /* Sunday's Red Egg, out of 120: every week you finished it */
  const sunRow=()=>{const wk={...RS.get("lbWeeks",{})},cw=currentWeek();if(SUNDAY_KEYS.every(k=>k in cw.sunday))wk[cw.id]={...(wk[cw.id]||{}),sun:SUNDAY_KEYS.reduce((a,k)=>a+(+cw.sunday[k]||0),0)};
    const s=Object.values(wk).map(w=>w&&w.sun).filter(v=>v!=null).map(v=>Math.round(+v));
    const a=s.length?Math.round(s.reduce((x,y)=>x+y,0)/s.length):null,b=s.length?Math.max(...s):null;
    return `<tr class="gtap" data-g="sunday"><td>The Red Egg</td><td>${s.length}</td><td>${a??"–"}${a!=null?`<span class="meter"><i style="width:${Math.round(a/1.2)}%"></i></span>`:""}</td><td>${b??"–"}</td></tr>`};
  $("gtable").innerHTML=`<thead><tr><th>Game</th><th>Played</th><th>Average</th><th>Best</th></tr></thead><tbody>${games.map(g=>{
    const s=hist.filter(h=>h.game===g.key).map(h=>h.score);
    const a=s.length?Math.round(s.reduce((x,y)=>x+y,0)/s.length):null,b=s.length?Math.max(...s):null;
    return `<tr class="gtap" data-g="${g.key}"><td>${g.name}</td><td>${s.length}</td><td>${a??"–"}${a!=null?`<span class="meter"><i style="width:${a}%"></i></span>`:""}</td><td>${b??"–"}</td></tr>`}).join("")}${sunRow()}</tbody>`;

  /* tap a game: your score in it each week, with that week's total */
  const allWeeks=()=>{const wk={};Object.entries(RS.get("lbWeeks",{})).forEach(([k,v])=>{if(v)wk[k]={days:{...(v.days||{})},sun:v.sun??null,total:v.total??null}});
    const cw=currentWeek(),sun=Object.keys(cw.sunday).length?SUNDAY_KEYS.reduce((a,k)=>a+(+cw.sunday[k]||0),0):null;
    wk[cw.id]={days:{...(wk[cw.id]?wk[cw.id].days:{}),...cw.days},sun:SUNDAY_KEYS.every(k=>k in cw.sunday)?sun:(wk[cw.id]?wk[cw.id].sun:null),total:null};
    Object.values(wk).forEach(w=>{if(w.total==null)w.total=Math.round(Object.values(w.days).reduce((a,b)=>a+(+b||0),0)+(+w.sun||0))});
    pen.forEach(p=>{if(wk[p.id])wk[p.id].total=p.total});return wk};
  $("gtable").addEventListener("click",e=>{const tr=e.target.closest("tr.gtap");if(!tr)return;const k=tr.dataset.g,wk=allWeeks();
    const name=k==="sunday"?"The Red Egg":(DAYS.find(d=>d.key===k)||{}).name;
    const rows=Object.keys(wk).sort().reverse().map(id=>{const w=wk[id],v=k==="sunday"?w.sun:w.days[k];if(v==null)return "";
      return `<li><span>Week of ${label(new Date(id+"T12:00:00"))}</span><b>${Math.round(+v)}</b><small class="wtot">Week ${w.total}</small></li>`}).join("");
    openSheet(`<h3>${name}</h3><div class="sheetsub"><span>Your results by week</span></div>`,
      rows?`<ul class="sheetlist weeklist">${rows}</ul>`:`<p class="empty">You haven't played ${name} yet.</p>`)});
})();

/* ---------- Stats: You | Friends ---------- */
(function(){
  if($("weekLabel"))$("weekLabel").textContent=label(new Date(CUR_MONDAY+"T12:00:00"));
  const views={friends:$("vFriends"),you:$("vYou")};let bootP=null;
  function show(v){Object.keys(views).forEach(k=>views[k].hidden=k!==v);
    document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
    if(v==="friends"&&!bootP)bootP=boot()}
  $("seg").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)};

  /* the days you can flip through: last week Monday through today */
  const SPAN=[];{const d=new Date(CUR_MONDAY+"T12:00:00");d.setDate(d.getDate()-7);for(let i=0;i<7+TODAY_IDX+1;i++){SPAN.push(new Date(d));d.setDate(d.getDate()+1)}}
  let pos=SPAN.length-1,players=null,openId=null,me=null,booted=false,BD=null,friendIds=new Set();
  const myPen=()=>{const c={};RS.get("pen",[]).forEach(p=>{const k=penKey(p);c[k]=(c[k]||0)+1});return c};
  const num=v=>{v=+v;return isFinite(v)?Math.max(0,Math.min(720,v)):0};

  /* chicks show in full color here; only the secret ones and the top 3 stay hidden until you own them */
  const seen=(t,own)=>own||!stayHidden(t);
  const colorPic=(t,own)=>miniSVG(t,!seen(t,own));
  function rowsFor(d){
    const wk=ymd(mondayOf(d)),di=(d.getDay()+6)%7;
    return players.map(p=>{
      const w=(p.weeks&&p.weeks[wk])||null;let day=null,tot=0,gp=0;
      if(w){const days=w.days||{};
        DAY_KEYS.slice(0,6).forEach((k,i)=>{if(i<=di&&k in days){tot+=num(days[k]);gp++}});if(di===6&&w.sun!=null)gp++;
        if(di<6)day=DAY_KEYS[di] in days?num(days[DAY_KEYS[di]]):null;
        else{day=w.sun!=null?num(w.sun):null;if(day!=null)tot+=day;if(w.chick&&w.total!=null)tot=num(w.total)}
      }
      const chick=di===6&&w&&w.chick?ALL_CHICKS.find(t=>t.key===w.chick):null;
      return {p,day,gp,tot:Math.round(tot),chick,played:!!w&&Object.keys(w.days||{}).length+(w.sun!=null?1:0)>0};
    }).filter(r=>!isAdmin()||r.gp>0||r.p.id===me).sort((a,b)=>b.tot-a.tot||(b.day??-1)-(a.day??-1)||String(a.p.name).localeCompare(String(b.p.name)));
  }
  function render(){
    const d=SPAN[pos],di=(d.getDay()+6)%7,mine=myPen();
    $("dayTitle").textContent=pos===SPAN.length-1?"Today":DAY_NAMES[di];
    $("daySub").textContent=`${label(d)} · ${di===6?"The Red Egg":DAYS[di].name}`;
    $("prevDay").disabled=pos===0;$("nextDay").disabled=pos===SPAN.length-1;
    renderStand(d);
    const rows=rowsFor(d);
    if(!rows.length){$("lbList").innerHTML=`<li class="lbempty">No one yet.</li>`;return}
    let rank=0,last=null;
    $("lbList").innerHTML=rows.map((r,i)=>{
      if(r.tot!==last){rank=i+1;last=r.tot}
      const you=r.p.id===me,ch=r.chick?`<span class="lbchick" title="${esc(r.chick.name)}">${colorPic(r.chick,!!mine[r.chick.key])}</span>`:"";
      return `<li><button class="lbrow${you?" you":""}" data-id="${esc(r.p.id)}">
        <span class="lbrank">${r.played?rank:"–"}</span>
        <span class="lbname">${ch}<span class="nmtxt">${esc(r.p.name||"Someone")}</span>${you?`<em>you</em>`:""}</span>
        <span class="lbgp">${r.gp||"–"}</span>
        <span class="lbday">${r.day==null?"–":Math.round(r.day)}</span>
        <span class="lbtot">${r.tot}</span></button></li>`}).join("")
      +(friendIds.size||isAdmin()?"":`<li class="lbempty">Add friends below to see how you stack up.</li>`);
    renderPen();
  }
  function renderPen(){}
  /* where you stand among everyone who played that day, and in the week so far (no names, just the curve) */
  function renderStand(d){
    const el=$("stand");if(!BD||!BD.dist){el.innerHTML="";return}
    const wk=ymd(mondayOf(d)),di=(d.getDay()+6)%7,rows=(BD.dist.weeks||{})[wk]||[],mw=((BD.me&&BD.me.weeks)||{})[wk]||null;
    const myRow=mw?[...DAY_KEYS.slice(0,6).map(k=>mw.days&&k in mw.days?Math.round(num(mw.days[k])*10)/10:null),mw.sun!=null?Math.round(num(mw.sun)*10)/10:null]:null;
    const game=di===6?"The Red Egg":DAYS[di].name,max=di===6?120:100;
    const dayVals=rows.map(r=>r[di]).filter(v=>v!=null),mine=myRow?myRow[di]:null;
    const sumTo=r=>{let t=0,any=false;for(let i=0;i<=di;i++)if(r[i]!=null){t+=r[i];any=true}return any?t:null};
    const wkVals=rows.map(sumTo).filter(v=>v!=null),myWk=myRow?sumTo(myRow):null;
    const line=(label,val,vals,mx)=>{if(vals.length-(val==null?0:1)<1)return "";const st=lbStand(vals,val),txt=val==null?`You haven't played ${label} yet`:lbStandText(st);
      return `<div class="standrow"><div class="standtop"><span>${label}</span>${val==null?"":`<b>${Math.round(val)}</b>`}</div>${vals.length>1?lbCurve(vals,val,mx):""}<p>${txt||"&nbsp;"}</p></div>`};
    const rows2=line(game,mine,dayVals,max)+(di>0?line("Week so far",myWk,wkVals,di===6?720:(di+1)*100):"");
    el.innerHTML=rows2?`<h3>Where you stand</h3>`+rows2:"";el.hidden=!rows2;
  }
  function playerSheet(id){
    const p=players&&players.find(x=>x.id===id);if(!p)return;
    const mine=myPen(),theirs=p.pen||{};
    const has=ALL_CHICKS.filter(t=>num(theirs[t.key])>0);
    const tc=Math.round(has.reduce((a,t)=>a+num(theirs[t.key]),0));
    const d=SPAN[pos],wk=ymd(mondayOf(d)),w=(p.weeks&&p.weeks[wk])||{},days=w.days||{};
    const fmt=v=>v==null?'<span class="mut">–</span>':Math.round(num(v));
    let tot=0;DAY_KEYS.slice(0,6).forEach(k=>{if(k in days)tot+=num(days[k])});if(w.sun!=null)tot+=num(w.sun);if(w.chick&&w.total!=null)tot=num(w.total);
    const ch=w.chick?ALL_CHICKS.find(t=>t.key===w.chick):null;
    const rows=DAYS.slice(0,6).map((g,i)=>`<li><span>${DAY_NAMES[i].slice(0,3)} · ${g.name}</span><b>${fmt(days[DAY_KEYS[i]])}</b></li>`).join("")
      +`<li><span>Sun · The Red Egg</span><b>${fmt(w.sun)}</b></li><li class="tot"><span>Week${ch?" · "+(mine[ch.key]||!stayHidden(ch)?ch.name:"???"):""}</span><b>${Math.round(tot)}</b></li>`;
    const pen=has.length?`<div class="coll">${has.map(t=>{const n=Math.round(num(theirs[t.key])),known=seen(t,!!mine[t.key]);
      return `<div class="slot${known?" b-"+t.rar:" locked"}${t.exact!=null?" special":""}"><span class="ct">×${n}</span>${colorPic(t,known)}<span class="nm">${chickLabel(t,known)}</span>${known?rarTag(t):'<span class="rar rarph" aria-hidden="true">&nbsp;</span>'}</div>`}).join("")}</div>`:`<p class="empty">No chicks yet.</p>`;
    openSheet(`<div class="sheetpic">${ch?colorPic(ch,!!mine[ch.key]):eggMini()}</div><h3>${esc(p.name||"Someone")}${p.id===me?" <small class=\"you\">you</small>":""}</h3><div class="sheetsub"><span>${tc} chick${tc===1?"":"s"}</span></div>`,
      `<h4>Week of ${label(new Date(wk+"T12:00:00"))}</h4><ul class="sheetlist">${rows}</ul><h4>Pen</h4>${pen}`
      +(friendIds.has(p.id)?`<p class="unfriend"><button class="linkbtn" id="unfriendBtn">Remove friend</button></p>`:"")+adminBox(p));
    wireAdmin(p);
    const ub=$("unfriendBtn");if(ub){let arm=false;ub.onclick=async()=>{if(!arm){arm=true;ub.textContent=`Tap again to remove ${p.name}`;return}
      ub.disabled=true;try{await LB.friend("remove",p.id);closeSheet();await load()}catch(e){ub.textContent="That didn't work. Try again.";ub.disabled=false}}}
  }
  /* ---- admin: delete a player, or merge a duplicate into the real account ---- */
  const isAdmin=()=>!!RS.get("adminPin","");
  function adminBox(p){
    if(!isAdmin())return "";
    const others=players.filter(x=>x.id!==p.id).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
    return `<div class="adminbox"><h4>Admin</h4>
      <div class="adminrow"><select id="mergeInto"><option value="">Merge into…</option>${others.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select><button id="mergeBtn" class="adminbtn" disabled>Merge</button></div>
      <div class="adminrow"><input id="newPass" type="text" autocomplete="off" placeholder="New password for ${esc(p.name)}"><button id="passSetBtn" class="adminbtn">Set</button></div>
      <button id="delBtn" class="adminbtn danger">Delete ${esc(p.name)}</button><p class="adminmsg" id="adminMsg"></p></div>`;
  }
  function wireAdmin(p){
    if(!isAdmin())return;
    const sel=$("mergeInto"),mb=$("mergeBtn"),db=$("delBtn"),msg=$("adminMsg");let armDel=false,armMerge=false;
    const fail=e=>{const c=e&&e.message;msg.textContent=c==="bad_pin"||c==="locked"?"Admin PIN no longer works.":"That didn't work. Try again.";if(c==="bad_pin"||c==="locked")RS.set("adminPin","")};
    const done=async t=>{msg.textContent=t;await load();setTimeout(closeSheet,700)};
    sel.onchange=()=>{mb.disabled=!sel.value;armMerge=false;mb.textContent="Merge"};
    mb.onclick=async()=>{if(!sel.value)return;const to=players.find(x=>x.id===sel.value);
      if(!armMerge){armMerge=true;mb.textContent="Tap to confirm";msg.textContent=`${p.name}'s scores and chicks move to ${to.name}, then ${p.name} is removed.`;return}
      mb.disabled=true;try{await LB.admin("merge",{from:p.id,into:sel.value});await done("Merged.")}catch(e){fail(e);mb.disabled=false}};
    $("passSetBtn").onclick=async()=>{const pw=$("newPass").value;if(pw.length<4){msg.textContent="At least 4 characters.";return}
      try{await LB.admin("setpass",{id:p.id,password:pw});msg.textContent=`${p.name} can now log in with that password.`;$("newPass").value=""}catch(e){fail(e)}};
    db.onclick=async()=>{if(!armDel){armDel=true;db.textContent="Tap again to delete";msg.textContent=`This removes ${p.name} from the leaderboard for good.`;return}
      db.disabled=true;try{await LB.admin("delete",{id:p.id});await done("Deleted.")}catch(e){fail(e);db.disabled=false}};
  }
  (function(){const bb=$("betaBadge");if(!bb)return;let n=0,t=null;
    bb.onclick=()=>{clearTimeout(t);t=setTimeout(()=>{n=0},5000);if(++n<5)return;n=0;
      if(isAdmin()){RS.set("adminPin","");openSheet(`<h3>Admin off</h3>`,`<p class="empty" style="text-align:center">Admin tools are hidden on this device.</p>`);return}
      openSheet(`<h3>Admin</h3>`,`<form class="pinform" id="pinForm"><input id="pinIn" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="PIN" aria-label="4-digit PIN"><button class="big" type="submit">Unlock</button><p class="adminmsg" id="pinMsg"></p></form>`);
      setTimeout(()=>$("pinIn")&&$("pinIn").focus(),60);
      $("pinForm").onsubmit=async e=>{e.preventDefault();const pin=$("pinIn").value.replace(/\D/g,"");if(pin.length!==4){$("pinMsg").textContent="Enter 4 digits.";return}
        try{await LB.admin("check",{pin});RS.set("adminPin",pin);$("pinMsg").textContent="Admin on. Tap a player to manage them.";setTimeout(closeSheet,900)}
        catch(err){const c=err&&err.message;$("pinMsg").textContent=c==="locked"?"Too many tries. Try again in an hour.":c==="not_set_up"?"Admin PIN isn't set up yet.":"Wrong PIN.";$("pinIn").value=""}};
    }})();
  function eggMini(){return `<svg viewBox="0 0 60 80" aria-hidden="true"><path d="M30 3C46 3 57 31 57 48C57 66 45 78 30 78C15 78 3 66 3 48C3 31 14 3 30 3Z" fill="var(--red)"/></svg>`}
  $("lbList").onclick=e=>{const b=e.target.closest(".lbrow");if(!b)return;playerSheet(b.dataset.id)};
  $("prevDay").onclick=()=>{if(pos>0){pos--;render()}};
  $("nextDay").onclick=()=>{if(pos<SPAN.length-1){pos++;render()}};

  async function load(){
    $("lbStatus").hidden=true;
    try{BD=await LB.board();me=(BD.me&&BD.me.id)||me;
      let list=[{...(BD.me||{}),id:me,name:(BD.me&&BD.me.name)||lbName()},...(BD.friends||[])];
      if(isAdmin()){try{list=await LB.list()}catch(e){}}
      players=list.filter(p=>p&&p.name);friendIds=new Set((BD.friends||[]).map(f=>f.id));
      $("myCode").textContent=BD.code||"";$("addCard").hidden=false;
      render();$("board").hidden=false}
    catch(e){$("board").hidden=true;$("addCard").hidden=true;$("lbStatus").hidden=false;$("lbStatus").textContent="The leaderboard can't load right now."}
  }
  let linkTimer=null;
  const J=wireJoin({onDone:async()=>{$("nameCard").hidden=true;await load()}});
  async function boot(){
    if(booted)return;booted=true;
    const b=await LB.init();
    if(!b){$("nameCard").hidden=true;$("board").hidden=true;$("lbStatus").hidden=false;$("lbStatus").textContent="The leaderboard can't load here.";return}
    me=b.id;
    if(!lbName()){J.setMode("choose");$("nameCard").hidden=false;$("board").hidden=true;return}
    $("nameCard").hidden=true;
    await lbSync();await lbPendingAdd();await load();
  }
  $("renameBtn").onclick=()=>{J.setMode("rename");$("nameCard").hidden=false;$("nameIn").focus()};
  $("passBtn").onclick=()=>{J.setMode("setpass");$("nameCard").hidden=false;$("passIn").focus()};
  /* Google as a backup way in, if the site has it set up and this account doesn't have it yet */
  LB.authConfig().then(async cfg=>{if(!cfg.google)return;let st={};try{st=await LB.status()}catch(e){}if(st.google)return;
    const b=document.createElement("button");b.textContent="Add Google";$("renameRow").appendChild(b);
    b.onclick=()=>{openSheet(`<h3>Add Google</h3>`,`<div id="gLink" style="display:flex;justify-content:center;min-height:44px"></div><p class="adminmsg" id="gMsg"></p>`);
      lbGoogleButton($("gLink"),async cred=>{try{await LB.linkGoogle(cred);$("gMsg").textContent="Google added.";b.remove();setTimeout(closeSheet,900)}catch(e){$("gMsg").textContent=e.message==="google_taken"?"That Google account is already used by another player.":"That didn't work. Try again."}})}});
  $("linkBtn").onclick=async()=>{
    const btn=$("linkBtn");btn.disabled=true;
    try{
      const {code,exp}=await LB.createLink();
      $("linkCode").textContent="EGG-"+code;$("linkCard").hidden=false;
      clearInterval(linkTimer);
      const tick=()=>{const s=Math.max(0,Math.round((exp-Date.now())/1000));
        $("linkLeft").textContent=s?`Expires in ${Math.floor(s/60)}:${pad2(s%60)}`:"Expired";
        if(!s){clearInterval(linkTimer);$("linkCode").classList.add("dead")}};
      $("linkCode").classList.remove("dead");tick();linkTimer=setInterval(tick,1000);
      $("linkCard").scrollIntoView({behavior:"smooth",block:"nearest"});
    }catch(e){$("lbStatus").hidden=false;$("lbStatus").textContent="Couldn't make a code. Try again."}
    finally{btn.disabled=false}
  };
  $("linkDone").onclick=()=>{clearInterval(linkTimer);$("linkCard").hidden=true};
  /* inviting and adding friends */
  const inviteURL=()=>window.claude?"":location.origin+"/?add="+(BD&&BD.code||"");
  $("inviteBtn").onclick=async()=>{const code=BD&&BD.code;if(!code)return;const url=inviteURL(),msg=$("addMsg");
    const text=url?`Add me on The Red Egg so we can compare scores 🥚 ${url}`:`Add me on The Red Egg 🥚 My code: ${code}`;
    try{if(url&&navigator.share){await navigator.share({text:`Add me on The Red Egg so we can compare scores 🥚`,url});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(text);msg.textContent=url?"Invite link copied. Paste it to a friend.":"Copied. Send your code to a friend."}catch(e){msg.textContent="Your code is "+code}};
  $("addForm").onsubmit=async e=>{e.preventDefault();const v=$("addIn").value.trim(),msg=$("addMsg");if(!v){$("addIn").focus();return}
    $("addBtn").disabled=true;msg.textContent="";
    try{const d=await LB.friend("add",v);$("addIn").value="";msg.textContent=d&&d.friend&&d.friend.name?`${d.friend.name} added.`:"Friend added.";await load()}
    catch(err){const c=err&&err.message;msg.textContent=c==="self"?"That's your own code.":c==="no_code"?"No one has that code. Check it and try again.":c==="signin"?"Pick a username first.":"That didn't work. Try again."}
    finally{$("addBtn").disabled=false}};

  show(typeof PAGE_VIEW!=="undefined"?PAGE_VIEW:"friends");
  /* the gear's Account square sends you here to change your username or password */
  try{const a=new URLSearchParams(location.search).get("acct");if(a){
    if(PAGE_VIEW!=="friends")show("friends");
    (bootP||Promise.resolve()).then(()=>{if(!lbName())return;J.setMode(a==="setpass"?"setpass":"rename");$("nameCard").hidden=false;setTimeout(()=>{const i=$(a==="setpass"?"passIn":"nameIn");if(i)i.focus()},60)})}}catch(e){}
})();

</script>

</style>
