<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#FFC9A0">
<title>Red Egg: The Red Bomb</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{--ink:#3B2A1E;--muted:#7A5636;--red:#E0303F;--cream:#FFF8EC;--vvh:100vh;--vvtop:0px;--avail:100vh;
  --disp:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;--round:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#FFC9A0;font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{position:fixed;inset:0}
[hidden]{display:none!important}

/* ---------- the climb: one scene per zone, sliding down as you rise ---------- */
#sky{position:fixed;inset:0;z-index:0;transition:background 1.4s ease}
#stars{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.6s;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.scene{position:fixed;left:0;right:0;top:var(--vvtop);height:var(--avail);z-index:0;pointer-events:none;transition:transform 1.4s cubic-bezier(.3,.7,.3,1),opacity 1.4s}
.scene svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:max(100%,420px);height:100%}
.scene.enter{transform:translateY(-100%);opacity:0}
.streak{position:fixed;top:0;z-index:1;width:3px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.9));pointer-events:none}
.scene.leave{transform:translateY(100%);opacity:0}
.drift{animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.flap{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{to{transform:scaleY(.55)}}
.fly{animation:fly 14s linear infinite}
@keyframes fly{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.spin{animation:spinr 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spinr{to{transform:rotate(360deg)}}

/* ---------- top bar ---------- */
.top{position:fixed;left:0;right:0;top:var(--vvtop);z-index:4;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 6px}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);line-height:1}
.brand b{font:400 1.35rem var(--disp)}
.brand b span{color:var(--red)}
.brand small{font:800 .66rem var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:2px}
.top .r{text-align:right;font:800 .66rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.25}
.top .r a{display:block;color:inherit;text-decoration:none;margin-bottom:2px}
.top .r b{display:block;font:700 1.2rem var(--round);letter-spacing:0;color:var(--ink)}
#zoneLine{font:800 .7rem var(--body);letter-spacing:.08em;text-transform:uppercase}
body.night .top,body.night .brand,body.night .top .r,body.night .top .r b{color:#EEF1FF}

/* ---------- the stage: sized to whatever space the phone keyboard leaves ---------- */
#stage{position:fixed;left:0;right:0;top:calc(var(--vvtop) + env(safe-area-inset-top,0px) + 58px);height:calc(var(--avail) - env(safe-area-inset-top,0px) - 58px);z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vh,12px);padding:0 16px 12px}
body.touch #stage{justify-content:flex-end;padding-bottom:10px}
#bombWrap{position:relative;height:min(40vh,calc(var(--avail) * .4),250px);aspect-ratio:1/1.05;flex:none}
#bombWrap.shake{animation:shake .38s}
#bombWrap.tick{animation:tick .5s ease-in-out infinite}
@keyframes shake{20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes tick{50%{transform:scale(1.045) rotate(1.5deg)}}
#bomb{width:100%;height:100%;overflow:visible;display:block}
#combo{position:absolute;left:0;right:0;top:57%;transform:translateY(-50%);text-align:center;font:700 clamp(1.8rem,calc(var(--avail) * .065),3.4rem) var(--round);color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 rgba(90,0,10,.45)}
body.fire #combo{color:#FFF1B8;text-shadow:0 0 18px rgba(255,180,60,.95),0 3px 0 rgba(90,0,10,.5)}
#secs{position:absolute;left:50%;top:80%;transform:translateX(-50%);font:800 .9rem var(--body);color:rgba(255,255,255,.85)}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;background:#FFD24A;box-shadow:0 0 8px #FFB020;pointer-events:none;z-index:3}

/* the meter: three slots; short words fill 1, medium 2, big 3 */
#meter{display:flex;gap:6px;width:min(64vw,250px);padding:5px 7px;border-radius:999px;background:rgba(40,25,15,.32);box-shadow:0 2px 6px rgba(0,0,0,.15)}
#meter i{flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 2px rgba(0,0,0,.15),0 0 0 1.5px rgba(59,42,30,.25);transition:background .25s,transform .25s}
#meter i.on{background:linear-gradient(90deg,#3E8E3A,#7CCB5B);transform:scaleY(1.15)}
body.fire #meter i.on{background:linear-gradient(90deg,#FF5A1F,#FFC23D)}

/* the word you're typing, on the phone's own keyboard */
#entry{width:min(100%,360px);display:flex;gap:8px}
#word{flex:1;min-width:0;font:700 1.6rem var(--round);letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:10px 12px;border-radius:16px;border:3px solid rgba(59,42,30,.15);background:rgba(255,248,236,.94);color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;caret-color:var(--red)}
#word:focus{border-color:var(--red)}
#go{flex:none;border:0;border-radius:16px;padding:0 18px;font:700 1.05rem var(--round);background:var(--red);color:#fff;box-shadow:0 4px 0 #A81E2B;cursor:pointer}
body.fire #go{background:linear-gradient(90deg,#FF4E00,#FFA41B);box-shadow:0 4px 0 #C23D00}
#msg{min-height:22px;padding:2px 12px;border-radius:999px;background:rgba(255,248,236,.85);font:800 .95rem var(--body);color:var(--muted);text-align:center}
body.night #msg{color:#DCE3FF;background:rgba(10,14,40,.35)}
#msg:empty{background:none}
#msg.bad{color:var(--red)}
#msg.good{color:#2E7D32}
body.night #msg.bad{color:#FF9AA2}
body.night #msg.good{color:#9BE58B}

.pop{position:fixed;z-index:6;font:700 1.6rem var(--round);color:#2E7D32;pointer-events:none;animation:pop .9s ease-out forwards;text-shadow:0 2px 0 #fff}
body.fire .pop{color:#FF6A00}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.tierTag{position:fixed;z-index:6;transform:translate(-50%,-50%) rotate(-16deg);font:400 1.55rem var(--disp);color:#fff;-webkit-text-stroke:2px var(--ink);pointer-events:none;animation:tag 1s ease-out forwards;white-space:nowrap}
@keyframes tag{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-24deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(-14deg)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1) rotate(-16deg)}}
/* a new zone: a banner sweeps across */
#zoneBanner{position:fixed;z-index:7;left:10px;right:10px;top:calc(var(--vvtop) + env(safe-area-inset-top,0px) + 6px);padding:6px 10px 8px;border-radius:18px;background:linear-gradient(90deg,rgba(40,25,15,.88),rgba(90,30,40,.88));box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0}
#zoneBanner.on{animation:zb 2.2s ease-out forwards}
#zoneBanner small{font:800 .62rem var(--body);letter-spacing:.2em;text-transform:uppercase;color:#FFC23D}
#zoneBanner b{font:400 1.5rem var(--disp);color:#fff;white-space:nowrap;margin-top:2px}
@keyframes zb{0%{opacity:0;transform:translateX(-60px)}12%{opacity:1;transform:translateX(0)}80%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(60px)}}

#danger{position:fixed;inset:0;z-index:1;pointer-events:none}
body.low #danger{animation:beat .55s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:inset 0 0 60px 10px rgba(224,48,63,.35)}50%{box-shadow:inset 0 0 110px 30px rgba(224,48,63,.6)}}
#flashBad{position:fixed;inset:0;z-index:5;background:rgba(224,48,63,.25);opacity:0;pointer-events:none}
#flashBad.on{animation:fb .35s}
@keyframes fb{30%{opacity:1}}
#flames{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s}
body.fire #flames{opacity:1}
#flames::before,#flames::after{content:"";position:absolute;top:0;bottom:0;width:70px;background:linear-gradient(0deg,rgba(255,80,0,.75),rgba(255,170,30,.45) 40%,rgba(255,220,80,0) 85%);filter:blur(6px);animation:flick .35s ease-in-out infinite alternate}
#flames::before{left:-10px}
#flames::after{right:-10px;animation-delay:.17s}
@keyframes flick{from{transform:scaleY(1) translateY(0)}to{transform:scaleY(1.06) translateY(-8px)}}
#fireTag{position:fixed;z-index:4;left:50%;top:calc(var(--vvtop) + env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);font:400 1rem var(--disp);color:#fff;background:linear-gradient(90deg,#FF4E00,#FFB020);padding:5px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(255,90,0,.5);animation:pulse .6s ease-in-out infinite alternate;white-space:nowrap}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}

/* ---------- start / end ---------- */
.cover{position:fixed;left:0;right:0;top:var(--vvtop);height:var(--vvh);z-index:8;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,25,15,.35)}
.card{width:100%;max-width:400px;max-height:calc(var(--vvh) - 32px);overflow:auto;background:var(--cream);border-radius:26px;padding:22px 20px 20px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.card h1{margin:0;font:400 2.4rem var(--disp);color:var(--ink);line-height:1.05}
.card h1 span{color:var(--red)}
.card .kicker{font:400 1.3rem var(--disp);color:var(--red);letter-spacing:.04em;margin:2px 0 8px}
.card .sub{margin:0 0 14px;color:var(--muted);font-weight:700}
.rules{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;text-align:left}
.rules div{display:flex;gap:10px;align-items:center;background:#F5E6CC;border-radius:14px;padding:10px 12px;font-weight:700;font-size:.95rem}
.rules b{font:700 1.05rem var(--round);min-width:52px;text-align:center;color:var(--red)}
.rules em{margin-left:auto;font-style:normal;font:700 .95rem var(--round);color:#2E7D32;white-space:nowrap}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:16px;font:700 1.2rem var(--round);cursor:pointer;background:var(--red);color:#fff;box-shadow:0 5px 0 #A81E2B;text-decoration:none}
.btn.alt{background:#F5E6CC;color:var(--ink);box-shadow:none;margin-top:10px;font-size:1rem}
.best{margin-top:12px;color:var(--muted);font-weight:800;font-size:.85rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.stats div{background:#F5E6CC;border-radius:14px;padding:10px 6px}
.stats b{display:block;font:700 1.3rem var(--round);color:var(--ink);word-break:break-word}
.stats small{font-weight:800;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.madeit{margin:10px 0 0;font:700 1.15rem var(--round);color:var(--ink)}
.bigscore{font:700 3.6rem var(--round);color:var(--red);line-height:1}
.newbest{display:inline-block;margin-top:6px;background:linear-gradient(90deg,#FF4E00,#FFB020);color:#fff;font:800 .8rem var(--body);padding:4px 12px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
#boom{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle at 50% 34%,#fff 0,#FFE27A 12%,#FF7A1A 30%,rgba(224,48,63,.6) 50%,rgba(0,0,0,0) 72%);opacity:0}
#boom.on{animation:boom 1.1s ease-out forwards}
@keyframes boom{0%{opacity:0;transform:scale(.2)}12%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.debris{position:fixed;z-index:7;width:10px;height:10px;border-radius:3px;background:#8E1622;pointer-events:none}
#loading{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;font:700 1.2rem var(--round);color:var(--ink)}

/* height meter */
#alt{position:fixed;left:8px;width:28px;z-index:3;pointer-events:none}
#alt .track,#altFill{position:absolute;left:50%;width:6px;margin-left:-3px;border-radius:6px}
#alt .track{top:0;bottom:0;background:linear-gradient(0deg,rgba(120,80,40,.35),rgba(80,140,220,.35) 50%,rgba(40,20,90,.5));box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
#altFill{bottom:0;background:linear-gradient(0deg,#E0303F,#FF8A3D);transition:height .9s cubic-bezier(.3,.7,.3,1)}
#altMarks i{position:absolute;left:50%;transform:translate(-50%,50%) scale(.75);font-style:normal;font-size:13px;line-height:1;opacity:.35;filter:grayscale(1);transition:opacity .4s,filter .4s,transform .4s}
#altMarks i.on{opacity:1;filter:none;transform:translate(-50%,50%) scale(.9)}
#altMarks i.pop{animation:altpop .9s ease-out}
@keyframes altpop{0%{transform:translate(-50%,50%) scale(.9)}35%{transform:translate(-50%,50%) scale(2.1);filter:drop-shadow(0 0 6px #FFD24A)}100%{transform:translate(-50%,50%) scale(.9)}}
#altMe{position:absolute;left:50%;width:16px;height:16px;margin-left:-8px;margin-bottom:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8A8F,#D62F3C 55%,#7E0F1D);box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35);transition:bottom .9s cubic-bezier(.3,.7,.3,1);z-index:2}
#altMe.bounce{animation:altb .7s ease-out}
@keyframes altb{40%{transform:scale(1.5)}}
#combo.zonecall{font-size:clamp(.95rem,calc(var(--avail) * .032),1.4rem);letter-spacing:.04em;line-height:1.1;padding:0 14%}
#combo.zonecall span{display:block;font-size:2em;margin-bottom:2px}

/* your best, out in the sky */
#bestBand{position:fixed;left:0;right:0;height:26px;z-index:1;pointer-events:none;transition:top .9s cubic-bezier(.3,.7,.3,1),opacity .3s;display:flex;align-items:center;justify-content:flex-start;padding-left:44px}
#bestBand .belt{position:absolute;left:0;right:0;top:50%;height:0;border-top:3px dashed #FFC23D;filter:drop-shadow(0 0 6px rgba(255,194,61,.9))}
#bestBand span{position:relative;font:800 .66rem var(--body);letter-spacing:.12em;color:#5A3A00;background:#FFC23D;padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#bestBand.space .belt{border:0;height:22px;margin-top:-11px;background:
  radial-gradient(circle at 6% 50%,#9A8F86 0 6px,transparent 7px),radial-gradient(circle at 15% 35%,#7D726A 0 4px,transparent 5px),radial-gradient(circle at 24% 60%,#A89C92 0 8px,transparent 9px),
  radial-gradient(circle at 36% 40%,#8A7F77 0 5px,transparent 6px),radial-gradient(circle at 47% 62%,#9A8F86 0 7px,transparent 8px),radial-gradient(circle at 58% 38%,#B0A499 0 4px,transparent 5px),
  radial-gradient(circle at 68% 58%,#7D726A 0 6px,transparent 7px),radial-gradient(circle at 79% 42%,#A89C92 0 5px,transparent 6px),radial-gradient(circle at 90% 60%,#8A7F77 0 7px,transparent 8px);
  background-size:220px 22px;animation:belt 6s linear infinite;filter:drop-shadow(0 0 4px rgba(255,170,90,.6))}
@keyframes belt{to{background-position:220px 0}}
#bestBand.burst{animation:bburst .8s ease-out forwards}
@keyframes bburst{30%{transform:scaleY(1.8);opacity:1}100%{transform:scaleY(.2);opacity:0}}
.rock{position:fixed;z-index:6;width:9px;height:9px;border-radius:40%;background:#8A7F77;pointer-events:none}
.rock.gold{background:#FFC23D;box-shadow:0 0 6px #FFC23D}
#altBest{position:absolute;left:50%;width:18px;height:3px;margin-left:-9px;margin-bottom:-1.5px;background:#FFC23D;border-radius:2px;box-shadow:0 0 6px #FFC23D;z-index:1}

.missed{margin:12px 0 0;background:#2E1A12;color:#FFF1DC;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.missed .mhead{grid-column:1/-1;font:800 .8rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:#FFB59A}
.missed .mhead b{font:700 1rem var(--round);color:#fff;letter-spacing:.08em}
.missed small{display:block;font:800 .62rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:#E8C9A8}
.missed .mw b{display:block;font:700 .9rem var(--round);letter-spacing:.02em;white-space:nowrap;margin-top:2px}
.missed .mw b.lg{font-size:.74rem}
.missed u{text-decoration:none;color:#FF6B74}

.stats.s3{grid-template-columns:1fr 1fr 1.6fr;margin:10px 0 12px;gap:6px}
.stats.s3 div{padding:8px 4px}
.stats.s3 b{font-size:1.1rem}
.stats.s3 b.lw{font-size:.85rem;line-height:1.35rem}
.endbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.endbtns .btn{padding:14px 6px;font-size:1.05rem}
.endbtns .btn.alt{margin-top:0}
.homelink{display:inline-block;margin-top:10px;font:800 .9rem var(--body);color:var(--muted)}
#endCard h1{font-size:2rem}
#endCard .bigscore{font-size:3rem}

.fflick{animation:fflick .12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fflick{from{transform:scale(.9,1) skewX(-4deg)}to{transform:scale(1.08,1.15) skewX(5deg)}}
.fglow{animation:fglow .3s ease-in-out infinite alternate}
@keyframes fglow{to{opacity:.65}}
</style>
</head><body>
<div id="sky"></div>
<div id="stars"></div>
<div id="scenes"></div>
<div id="danger"></div><div id="flames"></div><div id="flashBad"></div><div id="boom"></div>
<div class="top">
  <a class="brand" href="index.html"><b>The <span>Red</span> Egg</b><small>The Red Bomb: Liftoff</small></a>
  <div class="r"><a href="index.html">← Home</a><b id="score">0</b><span id="zoneLine">The Farm</span></div>
</div>
<div id="bestBand" hidden><div class="belt"></div><span id="bestTxt">YOUR BEST</span></div>
<div id="fireTag" hidden>ON FIRE 🔥 ×2</div>
<div id="alt" aria-hidden="true"><div class="track"></div><div id="altMarks"></div><div id="altFill"></div><div id="altBest" hidden></div><div id="altMe"></div></div>

<div id="stage">
  <div id="bombWrap">
    <svg id="bomb" viewBox="0 0 200 210" aria-hidden="true">
      <defs>
        <radialGradient id="bg" cx=".34" cy=".28" r=".9"><stop offset="0" stop-color="#FF8A8E"/><stop offset=".22" stop-color="#F0414E"/><stop offset=".58" stop-color="#C21F2F"/><stop offset=".88" stop-color="#7A0C18"/><stop offset="1" stop-color="#4E0610"/></radialGradient>
        <radialGradient id="bRim" cx=".78" cy=".86" r=".42"><stop offset="0" stop-color="#FF9B6B" stop-opacity=".55"/><stop offset="1" stop-color="#FF9B6B" stop-opacity="0"/></radialGradient>
        <radialGradient id="bShade" cx=".5" cy=".5" r=".5"><stop offset=".78" stop-color="#2A0006" stop-opacity="0"/><stop offset="1" stop-color="#2A0006" stop-opacity=".45"/></radialGradient>
        <linearGradient id="bMetal" x1="0" x2="1"><stop offset="0" stop-color="#2B1418"/><stop offset=".3" stop-color="#7A5A5E"/><stop offset=".48" stop-color="#C9B3B6"/><stop offset=".62" stop-color="#6B4A4F"/><stop offset="1" stop-color="#1E0C10"/></linearGradient>
        <linearGradient id="bMetalTop" x1="0" x2="1"><stop offset="0" stop-color="#4A2C31"/><stop offset=".5" stop-color="#A88D91"/><stop offset="1" stop-color="#3A1E23"/></linearGradient>
        <pattern id="rope" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="6" height="6" fill="#D8B27A"/><rect width="2.6" height="6" fill="#A47B45"/><rect x="2.6" width=".8" height="6" fill="#F1D6A6"/></pattern>
        <radialGradient id="fGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".95"/><stop offset=".45" stop-color="#FFB13B" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></radialGradient>
      </defs>
      <!-- the bomb: a shiny cast sphere with a reflected warm rim and a soft dark edge -->

function pop(t){const r=$("bombWrap").getBoundingClientRect(),p=document.createElement("div");p.className="pop";p.textContent=t;p.style.left=Math.min(innerWidth-40,r.left+r.width*.85)+"px";p.style.top=(r.top+r.height*.15)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),950)}
function tag(t){const p=document.createElement("div");p.className="tierTag";p.textContent=t;const r=$("bombWrap").getBoundingClientRect();p.style.left=Math.max(70,r.left+r.width*.2)+"px";p.style.top=(r.top+r.height*.1)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
function setFire(on){G.fire=on;document.body.classList.toggle("fire",on);$("fireTag").hidden=!on;if(on){G.fireRuns++;try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}}}
function defuse(){
  const bonus=10+Math.round(G.left*2)*(G.fire?2:1);G.score+=bonus;$("score").textContent=G.score;G.bombs++;
  const nz=climb();if(!nz&&!G.bestNow)tag(G.lastBig?"BIG WORD!":"DEFUSED!");G.bestNow=false;
  say(`+${bonus} bonus`,"good");document.body.classList.remove("low");$("bombWrap").classList.remove("tick");
  $("bombWrap").animate([{transform:"scale(1)",opacity:1},{transform:"scale(1.25)",opacity:0}],{duration:260,easing:"ease-in"}).onfinish=()=>newBomb(nz);
}
function explode(){
  G.over=true;cancelAnimationFrame(raf);document.body.classList.remove("low","fire");$("fireTag").hidden=true;$("word").blur();
  $("bombWrap").style.visibility="hidden";const bm=$("boom");bm.classList.remove("on");void bm.offsetWidth;bm.classList.add("on");
  try{navigator.vibrate&&navigator.vibrate([120,60,200])}catch(e){}
  const r=$("bombWrap").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<22;i++){const d=document.createElement("div");d.className="debris";d.style.left=cx+"px";d.style.top=cy+"px";document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,dist=80+Math.random()*220;d.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist+120}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1100,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>d.remove()}
  document.body.animate([{transform:"translate(0,0)"},{transform:"translate(-12px,8px)"},{transform:"translate(10px,-6px)"},{transform:"translate(-6px,4px)"},{transform:"translate(0,0)"}],{duration:420});
  setTimeout(showEnd,1150);
}
function showEnd(){
  $("bombWrap").style.visibility="";
  const Z=ZONES[zoneOf(G.score)],best=store.get("bombBest",0),isBest=G.score>best;if(isBest)store.set("bombBest",G.score);
  const share=`💣 The Red Bomb: Liftoff\n${G.bombs} defused · ${G.score} pts\nMade it to ${Z.name} ${Z.icon}${G.fireRuns?`\nOn fire ×${G.fireRuns} 🔥`:""}\n${SHARE_URL}`;
  const ms=missed(G.combo),hl=w=>w.toUpperCase().replace(G.combo.toUpperCase(),`<u>${G.combo.toUpperCase()}</u>`);
  $("endCard").innerHTML=`<h1>B<span>o</span>om!</h1>
    <p class="madeit">Made it to ${Z.icon} ${Z.name}</p>
    ${ms.length?`<div class="missed" style="grid-template-columns:repeat(${ms.length},1fr)"><div class="mhead">💥 <b>${G.combo.toUpperCase()}</b> got you</div>${ms.map(([l,w])=>`<div class="mw"><small>${l}</small><b${w.length>=10?' class="lg"':""}>${hl(w)}</b></div>`).join("")}</div>`:""}
    <div class="bigscore" style="margin-top:8px">${G.score}</div>${isBest?'<div class="newbest">New best</div>':`<div class="best">Best ${best}</div>`}
    <div class="stats s3">
      <div><b>${G.bombs}</b><small>Defused</small></div>
      <div><b>${G.bestStreak}</b><small>Streak</small></div>
      <div><b class="lw">${G.longest?G.longest.toUpperCase():"–"}</b><small>Longest</small></div>
    </div>
    <div class="endbtns"><button class="btn" id="againBtn">Play again</button><button class="btn alt" id="copyBtn">Copy result</button></div>
    <a class="homelink" href="index.html">Home</a>`;
  $("endCover").hidden=false;
  $("againBtn").onclick=start;
  $("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(share.includes("redegg.netlify.app")?share:share+"\nredegg.netlify.app");$("copyBtn").textContent="Copied"}catch(e){$("copyBtn").textContent="Couldn't copy"}};
}
$("entry").addEventListener("submit",e=>{e.preventDefault();submit()});
$("stage").addEventListener("pointerdown",e=>{if(G&&!G.over&&e.target.id!=="go"&&e.target.id!=="word")setTimeout(()=>$("word").focus({preventScroll:true}),0)});
$("startBtn").onclick=()=>{if(!WORDS){$("loading").hidden=false;return}$("word").focus({preventScroll:true});start()};
const b0=store.get("bombBest",0);$("bestLine").textContent=b0?`Your best: ${b0}`:"";
document.addEventListener("visibilitychange",()=>{if(G&&!G.over)G.paused=document.visibilityState==="hidden"});
showZone(0,true);
</script>
</body></html>
